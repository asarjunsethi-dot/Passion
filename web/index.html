<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>River Run</title>
<meta name="description" content="A WebGL boat game on a shared lake of the day with a live water simulation and a day and night sky. See the other sailors online. Steer with W A S D.">
<style>
  :root{
    --ink:#f4fbfb; --ink2:#bcd7da; --panel:rgba(8,32,40,.72); --edge:rgba(160,220,225,.25);
    --accent:#ffd36b; --bad:#ff6b5b; --good:#7be0a4;
  }
  html,body{margin:0;height:100%;background:#0a2a33;overflow:hidden;color:var(--ink);
    font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{pointer-events:none}
  #speedo{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);text-align:center;font-weight:600;font-size:15px;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
  #speedo .bar{width:90px;height:3px;margin:6px auto 0;border-radius:2px;background:rgba(255,255,255,.25)}
  #speedo .bar{overflow:hidden}
  #speedo .bar i{display:block;height:100%;width:100%;background:#fff;transition:width .15s}
  #clockbox{text-align:right;position:fixed;right:16px;top:14px;pointer-events:auto;font-size:13px;color:#fff;opacity:.75;text-shadow:0 1px 6px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
  #netbox{display:block;margin-top:4px;font-size:12px;letter-spacing:.04em;cursor:pointer}
  #netbox:empty{display:none}
  #tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .tag{position:absolute;left:0;top:0;font-size:12px;letter-spacing:.04em;color:#fff;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.7);will-change:transform}
  .tag i{display:none;font-style:normal;margin-right:4px}
  .tag.edge i{display:inline-block}
  .tag.edge{opacity:.8}
  #toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);font-size:14px;font-weight:500;letter-spacing:.14em;color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.5);opacity:0;transition:opacity .25s,transform .6s;pointer-events:none;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,-14px)}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #helpbtn{position:fixed;left:16px;top:14px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:transparent;
    color:#fff;font:600 13px/22px system-ui,sans-serif;padding:0;cursor:pointer;opacity:.75}
  #helpbtn:hover{opacity:1}
  #helppanel{position:fixed;left:16px;top:46px;font-size:12px;line-height:1.7;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);letter-spacing:.04em}
  .intro{pointer-events:auto;text-align:center;transform:translateY(-110px);color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.45)}
  .intro h1{margin:0 0 14px;font-size:30px;font-weight:300;letter-spacing:.32em;text-transform:uppercase}
  #boatsel{display:flex;gap:18px;justify-content:center;font-size:13px;letter-spacing:.06em}
  #boatsel span{opacity:.55;cursor:pointer;padding-bottom:3px;border-bottom:1px solid transparent}
  #boatsel span.on{opacity:1;border-bottom-color:#fff}
  #nick{display:block;margin:14px auto 0;width:150px;padding:3px 0;border:0;border-bottom:1px solid rgba(255,255,255,.35);background:transparent;
    color:#fff;font:13px/1.4 inherit;font-family:inherit;letter-spacing:.06em;text-align:center;outline:none;-webkit-user-select:text;user-select:text}
  #nick:focus{border-bottom-color:#fff}
  #nick::placeholder{color:rgba(255,255,255,.55)}
  .intro .hint{margin:16px 0 0;font-size:12px;opacity:.7;letter-spacing:.1em;cursor:pointer}
  .hide{display:none!important}
  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0a2a33}
  #touch{position:fixed;left:0;right:0;bottom:18px;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
  #touch div{pointer-events:auto;display:grid;grid-template-columns:repeat(2,64px);gap:10px}
  #touch button{height:64px;border-radius:16px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);font-size:22px}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="speedo"><span id="spd">0 km/h</span><div class="bar"><i id="boostbar"></i></div></div>
  <div id="clockbox"><span id="clock">06:00</span><span id="netbox" title="F: watch the other sailors"></span></div>
</div>
<div id="tags"></div>
<button id="helpbtn" aria-label="Controls">?</button>
<div id="helppanel" class="hide">W&nbsp;thrust<br>S&nbsp;brake<br>A&nbsp;D&nbsp;steer<br>Q&nbsp;E&nbsp;strafe<br>Shift&nbsp;boost<br>Space&nbsp;jump<br>1&ndash;5&nbsp;boat<br>F&nbsp;watch others<br>R&nbsp;restart</div>
<div id="toast"></div>

<div id="start" class="panel">
  <div class="intro">
    <h1>River Run</h1>
    <div id="boatsel"></div>
    <input id="nick" maxlength="16" placeholder="your name" autocomplete="off" spellcheck="false" aria-label="Your name">
    <p class="hint" id="go">press W to sail</p>
  </div>
</div>

<div id="touch">
  <div><button data-k="left">&#8630;</button><button data-k="right">&#8631;</button></div>
  <div><button data-k="down">&#9660;</button><button data-k="up">&#9650;</button></div>
</div>

<div id="nogl"><div><h1>WebGL 2 is not available</h1><p>This game needs a browser with WebGL 2 support.</p></div></div>

<script>
(() => {
'use strict';

/* ======================================================================
   Lake definition. Everyone online shares the lake of the day (a new
   random lake every day at midnight UTC), so players meet on the same
   water. ?seed=N opens lake N instead, which is also a private room.
   One set of numbers drives the physics and the shaders.
   ====================================================================== */
function rng(seed){
  let s = seed|0;
  return () => { s = (s + 0x6D2B79F5)|0; let t = Math.imul(s ^ (s>>>15), 1|s);
    t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t; return ((t ^ (t>>>14))>>>0)/4294967296; };
}
const QUERY = (() => { try { return new URLSearchParams(location.search); } catch(e) { return new URLSearchParams(); } })();
const DAY = Math.floor(Date.now()/86400000);
const SEED = (() => {
  const v = +QUERY.get('seed'); if (v) return v|0;
  return ((Math.floor(rng(DAY ^ 0x7f4a7c15)()*2147483646) + 1)|0);   // the lake of the day
})();
const wrand = rng(SEED);
const HARM = 6;
const LAKE = { R: 100 + wrand()*25, I: 18 + wrand()*7, ao: [], po: [], ai: [], pi: [] };
for (let k=1;k<=HARM;k++){
  LAKE.ao.push((wrand()*2-1)*0.12/Math.pow(k, 1.1)); LAKE.po.push(wrand()*6.2832);
  LAKE.ai.push((wrand()*2-1)*0.20/Math.pow(k, 1.0)); LAKE.pi.push(wrand()*6.2832);
}
function shapeR(base, a, ph, th){ let v = 1; for (let k=0;k<HARM;k++) v += a[k]*Math.sin((k+1)*th + ph[k]); return base*v; }
const outerR  = th => shapeR(LAKE.R, LAKE.ao, LAKE.po, th);
const islandR = th => shapeR(LAKE.I, LAKE.ai, LAKE.pi, th);
function bankDist(x, y){            // positive on the water, negative on land (outer shore and island)
  const r = Math.hypot(x, y), th = Math.atan2(y, x);
  return Math.min(outerR(th) - r, r - islandR(th))*0.9;
}
function bankNormal(x, y){          // points from land into the water
  const e = 0.05;
  const gx = bankDist(x+e,y) - bankDist(x-e,y), gy = bankDist(x,y+e) - bankDist(x,y-e);
  const l = Math.hypot(gx, gy) || 1;
  return [gx/l, gy/l];
}
/* Shore distance table: bankDist sampled once at load on a 1024 x 1024 grid over a 448 m
   square (0.44 m apart). Shaders read it as a filtered texture: one fetch instead of an
   arctangent and twelve sines for every water pixel, wave simulation texel, grass vertex
   and mesh pixel. CPU code doing many lookups a frame (foam, spray, balls, current) uses
   lakeD. Boat collisions keep the exact bankDist.                                       */
const LAKE_N = 1024, LAKE_EXT = 224;
const lakeTable = new Float32Array(LAKE_N*LAKE_N);
{
  const A = 4096, oT = new Float32Array(A + 2), iT = new Float32Array(A + 2), step = 2*LAKE_EXT/LAKE_N;
  for (let i=0;i<=A+1;i++){ const th = i/A*2*Math.PI - Math.PI; oT[i] = outerR(th); iT[i] = islandR(th); }
  for (let j=0;j<LAKE_N;j++){
    const y = -LAKE_EXT + (j + 0.5)*step;
    for (let i=0;i<LAKE_N;i++){
      const x = -LAKE_EXT + (i + 0.5)*step, r = Math.hypot(x, y);
      const f = (Math.atan2(y, x) + Math.PI)*(A/(2*Math.PI)), k = f|0, u = f - k;
      lakeTable[j*LAKE_N + i] = Math.min(oT[k] + (oT[k+1] - oT[k])*u - r, r - iT[k] - (iT[k+1] - iT[k])*u)*0.9;
    }
  }
}
function lakeD(x, y){                // bilinear lookup of bankDist; exact formula outside the table
  const sc = LAKE_N/(2*LAKE_EXT), fx = (x + LAKE_EXT)*sc - 0.5, fy = (y + LAKE_EXT)*sc - 0.5;
  if (!(fx >= 0 && fy >= 0 && fx < LAKE_N - 1 && fy < LAKE_N - 1)) return bankDist(x, y);
  const i = fx|0, j = fy|0, u = fx - i, v = fy - j, o = j*LAKE_N + i, T = lakeTable;
  return (T[o] + (T[o+1] - T[o])*u)*(1 - v) + (T[o+LAKE_N] + (T[o+LAKE_N+1] - T[o+LAKE_N])*u)*v;
}
function baseFlow(x, y){            // a slow circulation around the island, still at the shores
  const r = Math.hypot(x, y) || 1, sp = 0.35*Math.min(1, Math.max(0, lakeD(x, y)/6));
  return [-y/r*sp, x/r*sp];
}
const LAKE_UNIT = 15;               // texture unit kept for the shore distance texture in every program
const WORLD_GLSL = `
uniform sampler2D uLake;
float bankD(vec2 p){ return texture(uLake, p*${(0.5/LAKE_EXT).toFixed(8)} + 0.5).r; }
vec2 flowAt(vec2 p){ float r = max(length(p), 1.0); return vec2(-p.y, p.x)/r*0.35*clamp(bankD(p)/6.0, 0.0, 1.0); }`;

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a)/(b - a))); return t*t*(3 - 2*t); };

// Start point: on the south side, most of the way from the island to the outer shore.
const spawn = { x: 0, y: 0, th: -Math.PI/2 };
{
  const th = -Math.PI/2, r = islandR(th) + (outerR(th) - islandR(th))*0.87;
  spawn.x = Math.cos(th)*r; spawn.y = Math.sin(th)*r;
}


/* ======================================================================
   WebGL setup
   ====================================================================== */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, stencil:true, powerPreference:'high-performance' });
if (!gl){ document.getElementById('nogl').style.display = 'flex'; throw new Error('WebGL2 unavailable'); }
{                                                             // the shore distance texture (16 bit float, filtered)
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + LAKE_UNIT); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, LAKE_N, LAKE_N, 0, gl.RED, gl.FLOAT, lakeTable);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.activeTexture(gl.TEXTURE0);
}
const canRenderFloat = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    throw new Error('Shader compile failed: ' + log);
  }
  return s;
}
function makeProgram(vsSrc, fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link failed: ' + gl.getProgramInfoLog(p));
  p.u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const info = gl.getActiveUniform(p, i); const name = info.name.replace(/\[0\]$/, ''); p.u[name] = gl.getUniformLocation(p, info.name); }
  if (p.u.uLake){ gl.useProgram(p); gl.uniform1i(p.u.uLake, LAKE_UNIT); }
  return p;
}

const FULLSCREEN_VS = `#version 300 es
precision highp float;
out vec2 vUv; out vec2 vNdc;
void main(){
  vec2 pos = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  vUv = pos; vNdc = pos*2.0-1.0;
  gl_Position = vec4(vNdc, 0.0, 1.0);
}`;

const NOISE_GLSL = `
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<3;i++){ v+=a*vnoise(p); p=p*2.03+vec2(17.1,9.7); a*=0.5; } return v; }
`;

// Camera: tilted 30 degrees from straight down so the 3D models read as trees, not blobs.
const TILT = 30*Math.PI/180, SIN_T = Math.sin(TILT), COS_T = Math.cos(TILT);

// Scene light from the dynamic sky: direction toward the sun (or moon), its color, sky ambient.
const LIGHT_GLSL = `
uniform vec3 uLightDir, uLightCol, uAmbient;
vec3 groundShade(){ return pow(uAmbient + uLightCol*max(uLightDir.z, 0.0), vec3(0.4545)); }`;
// Cloud layers from the sky pack (cloud_tex_01 and 02, density 0.7, shape exponent 2), used for
// shadows that drift over the lake and the sky reflected in the water.
const CLOUD_GLSL = `
uniform sampler2D uCloud1, uCloud2;
uniform float uSkyClock, uDay, uOvercast, uWet; uniform vec2 uCloudWind;
float cloudH(sampler2D t, vec2 uv){ float h = texture(t, uv).r; h = clamp((h - 0.3)/0.7, 0.0, 1.0); return h*h; }
float cloudAt(vec2 p){ vec2 w = uCloudWind*uSkyClock*0.1; float a = cloudH(uCloud1, p*0.0035 + w*0.02), b = cloudH(uCloud2, p*0.0035 + w*0.01); return min(a, a*b); }
float cloudShade(vec2 p){ return 1.0 - 0.5*min(cloudAt(p)*2.5, 1.0)*uDay*(1.0 - uOvercast); }   // under a full overcast the light is even`;
// Port of the supplied Godot sky shader (shader_type sky). dir uses Godot axes, y up.
const SKY_GLSL = `
uniform sampler2D uStars, uNight2; uniform vec3 uSunG; uniform float uBlend;
const vec3 SKY_DAY = vec3(0.0,0.3,0.7), HORIZON_DAY = vec3(0.75,0.85,0.85), HORIZON_SUNSET = vec3(0.9,0.4,0.1);
const vec3 SKY_SUNSET = vec3(0.15,0.2,0.4), HORIZON_NIGHT = vec3(0.1,0.15,0.2), SKY_NIGHT = vec3(0.05,0.10,0.15);
const vec3 CLOUD_COLOR = vec3(0.8), SUN_COLOR = vec3(1.0,0.9,0.0), MOON_COLOR = vec3(0.5,0.55,0.7);
const float HORIZON_EXPONENT = 2.0, CLOUD_DEPTH = 2.0, CLOUD_OCCLUDE = 1.0;
const float SUN_SCALE = 0.05, SUN_STRENGTH = 15.0, MOON_SCALE = 0.03, MOON_STRENGTH = 15.0;
vec3 skyColor(vec3 dir){
  float t = 1.0/max(dir.y, 1e-3), blend = uBlend, cloud = 0.0;
  if (dir.y > 0.0){
    vec3 wind = vec3(uCloudWind.x, 0.0, uCloudWind.y)*uSkyClock*0.1, tiling = vec3(0.2);
    vec3 p1 = dir*t*tiling + wind, p2 = dir*t*tiling + wind*0.5;
    float h1 = cloudH(uCloud1, p1.xz), h2 = cloudH(uCloud2, p2.xz);
    p1 += dir*h1*CLOUD_DEPTH*0.1; p2 += dir*h2*CLOUD_DEPTH*0.1;
    h1 = cloudH(uCloud1, p1.xz); h2 = cloudH(uCloud2, p2.xz);
    cloud = min(h1, h1*h2)*smoothstep(0.0, 0.2, dir.y);
  }
  float sunD = clamp(1.0 - distance(dir, uSunG) - pow(cloud, CLOUD_OCCLUDE), 0.0, 1.0);
  vec3 sun = SUN_COLOR*SUN_STRENGTH*max(clamp(smoothstep(1.0 - SUN_SCALE, 1.0, sunD), 0.0, 1.0), min(1.0, pow(sunD, 4.0)*0.07));
  float moonD = clamp(1.0 - distance(dir, -uSunG) - pow(cloud, CLOUD_OCCLUDE*2.0), 0.0, 1.0);
  vec3 moon = MOON_COLOR*MOON_STRENGTH*max(clamp(smoothstep(1.0 - MOON_SCALE, 1.0, moonD), 0.0, 1.0), min(1.0, pow(moonD, 8.0)*0.07));
  float nightNoise = 0.5, stars = 0.0;
  if (blend < 0.05){                                         // the star and night textures are only needed after sunset
    vec2 suv = (dir/(1.0 - abs(t)*0.05)).xz;
    nightNoise = texture(uNight2, suv).r;
    stars = smoothstep(0.9, 0.95, texture(uStars, suv).r);
    stars = clamp(clamp(stars - cloud*2.0, 0.0, 1.0)*min(1.0, -blend), 0.0, 1.0)*(1.0 - uOvercast) + nightNoise*0.01;
  }
  vec3 hor = mix(HORIZON_SUNSET, HORIZON_DAY, clamp(blend, 0.0, 1.0));
  hor = mix(HORIZON_NIGHT, hor, pow(clamp(1.0 + blend, 0.0, 1.0), 4.0));
  vec3 sc = mix(SKY_SUNSET, SKY_DAY, clamp(blend, 0.0, 1.0));
  sc = mix(SKY_NIGHT*(nightNoise*0.5 + 0.5), sc, clamp(pow(1.0 + blend, 4.0), 0.0, 1.0));
  vec3 sky = mix(sc, hor, pow(1.0 - abs(dir.y), HORIZON_EXPONENT));
  sky = mix(sky, CLOUD_COLOR*(0.15 + 0.85*uDay), pow(cloud, 0.8));   // clouds dim at night (the original keeps them grey)
  sky += stars;
  sky = mix(sky, mix(sc*0.5, hor, dir.y + 1.0), clamp(pow(1.0 - dir.y, 2.0), 0.0, 1.0));
  sky += (sun + moon)*clamp(pow(dir.y + 1.0, 16.0), 0.0, 1.0);
  return sky;
}`;

/* ---------------- wave simulation (GPU, toroidal height field) ----------------
   The height field wraps around a WORLD sized window that follows the boat.
   Each step: advect by the river current, run the 2D wave equation, damp near
   the banks, and inject impulses from the hull, the propeller and the rocks.  */
const SIM_N = 512, SIM_WORLD = 96, SIM_DT = 1/60, SIM_C2 = 0.10, MAX_SRC = 16;
const simFS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uState;
uniform float uN, uWorld, uDt, uC2;
uniform vec2 uCam;
uniform vec4 uSrc[${MAX_SRC}];
uniform int uCount;
${WORLD_GLSL}
void main(){
  vec2 w0 = vUv*uWorld;
  vec2 p = w0 + uWorld*floor((uCam - w0)/uWorld + 0.5);   // copy of this texel nearest the camera
  vec2 u = flowAt(p);
  float d = bankD(p);
  vec2 uvA = vUv - u*uDt/uWorld;                           // semi Lagrangian advection
  float tx = 1.0/uN;
  vec2 s = texture(uState, uvA).rg;
  float lap = texture(uState, uvA+vec2(tx,0)).r + texture(uState, uvA-vec2(tx,0)).r
            + texture(uState, uvA+vec2(0,tx)).r + texture(uState, uvA-vec2(0,tx)).r - 4.0*s.r;
  float h = s.r + (s.r - s.g)*0.988 + uC2*lap;
  h *= 0.9992;
  for (int i=0;i<${MAX_SRC};i++){
    if (i>=uCount) break;
    vec2 dl = p - uSrc[i].xy; float d2 = dot(dl, dl), r2 = uSrc[i].z*uSrc[i].z;
    if (d2 < r2*12.0) h += uSrc[i].w*exp(-d2/r2);             // beyond that it adds less than a millionth
  }
  h *= mix(0.86, 1.0, smoothstep(0.0, 1.4, d));            // absorb energy at the shore
  h *= smoothstep(-0.15, 0.2, d);                          // no water on land
  h = clamp(h, -1.5, 1.5);
  o = vec4(h, s.r, 0.0, 1.0);
}`;

/* ---------------- procedural textures for the water shader ----------------
   The Godot shader samples four textures that were not in the upload (wave,
   wave normal, foam, caustics). These are generated once on the GPU instead,
   as seamless 512 pixel tiles with mipmaps, so textureLod blur works the same. */
const TEX_N = 512;
const genFS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform int uMode; uniform float uSeed, uBase; uniform int uOct;
${NOISE_GLSL}
vec2 grad(vec2 i, float P){ float a = hash21(mod(i, P) + uSeed*17.0)*6.2831853; return vec2(cos(a), sin(a)); }
float pnoise(vec2 p, float P){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
  float a = dot(grad(i,P), f), b = dot(grad(i+vec2(1,0),P), f-vec2(1,0));
  float c = dot(grad(i+vec2(0,1),P), f-vec2(0,1)), d = dot(grad(i+vec2(1,1),P), f-vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float pfbm(vec2 uv, float base){ float v=0.0, a=0.5, P=base; vec2 p=uv*base;
  for (int k=0;k<5;k++){ v += a*pnoise(p,P); p *= 2.0; P *= 2.0; a *= 0.5; } return v; }
float pfbmN(vec2 uv, float base, int oct){ float v=0.0, a=0.5, P=base; vec2 p=uv*base;
  for (int k=0;k<6;k++){ if (k >= oct) break; v += a*pnoise(p,P); p *= 2.0; P *= 2.0; a *= 0.5; } return v; }
vec2 worley(vec2 uv, float N){
  vec2 p = uv*N, i = floor(p), f = fract(p); float F1 = 8.0, F2 = 8.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(float(x), float(y));
    vec2 jit = hash22(mod(i+g, N) + uSeed*31.0);
    float d = length(g + jit - f);
    if (d < F1){ F2 = F1; F1 = d; } else if (d < F2) F2 = d;
  }
  return vec2(F1, F2);
}
void main(){
  vec2 uv = vUv;
  if (uMode == 1){                // foam shape: cellular bubbles with fine breakup
    vec2 F = worley(uv, 10.0);
    float v = clamp(F.x*1.25, 0.0, 1.0)*0.75 + clamp(0.5 + pfbm(uv, 16.0), 0.0, 1.0)*0.25;
    o = vec4(vec3(v), 1.0);
  } else if (uMode == 2){                // caustics: bright web along cell borders
    vec2 F = worley(uv, 6.0);
    float c = 1.0 - smoothstep(0.0, 0.16, F.y - F.x);
    o = vec4(vec3(c*c), 1.0);
  } else if (uMode == 5){                // inverted cellular noise: bright points for stars
    vec2 F = worley(uv, uBase);
    o = vec4(vec3(1.0 - clamp(F.x*1.6, 0.0, 1.0)), 1.0);
  } else {                               // seamless fractal noise stretched to the full 0 to 1 range (Godot normalize = true)
    o = vec4(vec3(clamp(0.5 + pfbmN(uv, uBase, uOct)*1.55, 0.0, 1.0)), 1.0);
  }
}`;

/* ---------------- lake water and land (one full screen pass) ----------------
   Started as a port of the supplied Godot water shader and since rewritten:
   six analytic ripple wave trains plus the live wake simulation for the
   surface, light absorption for the body, refraction, caustics, sky
   reflection, sun glints and shore foam. Depth comes from the shore distance. */
const waterFS = `#version 300 es
precision highp float;
in vec2 vNdc; out vec4 o;
uniform vec2 uCam, uHalf;
uniform float uTime, uWorld, uSimN, uHasSim, uSinT, uCosT;
uniform vec2 uSimC;
uniform float uRain;
uniform sampler2D uSim, uFoam, uCaus;
${WORLD_GLSL}
${NOISE_GLSL}
${LIGHT_GLSL}
${CLOUD_GLSL}
${SKY_GLSL}
uniform sampler2D uGroundNoise;

// BinbunGrass palette_01.tres: gradient offsets 1/6, 1/2, 5/6
const vec3 PAL0 = vec3(0.658824, 0.792157, 0.345098), PAL1 = vec3(0.458824, 0.654902, 0.262745), PAL2 = vec3(0.274510, 0.509804, 0.196078);
vec3 palette(float t){
  if (t <= 0.166667) return PAL0;
  if (t <= 0.5) return mix(PAL0, PAL1, (t - 0.166667)/0.333333);
  if (t <= 0.833333) return mix(PAL1, PAL2, (t - 0.5)/0.333333);
  return PAL2;
}

const float CAUSTICS_STRENGTH = 2.0; const vec2 CAUSTICS_SCALE = vec2(0.5);
vec3 toLinear(vec3 c){ return pow(c, vec3(2.2)); }
vec3 toSrgb(vec3 c){ return pow(clamp(c, 0.0, 1.0), vec3(1.0/2.2)); }

// Water depth in meters (negative on land) from the distance to the shore:
// a sandy shelf that drops to about 14 m in open water.
float depthAt(float d){ return d < 0.0 ? d : 14.0*pow(min(d/40.0, 1.0), 0.75); }

// Raindrop rings. Two jittered grids; in each cell a drop may land once per cycle (more often in
// heavier rain). Its ring spreads at about half a meter a second with a smaller ring trailing it,
// both fading within a second. Returns the slope (xy) and the light caught by crests and splash (z).
vec3 rainRings(vec2 p, float t, float amount){
  vec3 res = vec3(0.0);
  for (int L=0; L<2; L++){
    float sc = L == 0 ? 0.55 : 0.8, fl = float(L);
    vec2 q = p*sc + fl*17.3, cell = floor(q), f = fract(q);
    vec2 h = hash22(cell + fl*7.1);
    float period = 0.7 + 0.6*h.y, cyc = t/period + h.x*7.0, ph = fract(cyc), k = floor(cyc);
    if (hash21(cell*0.73 + k*1.37 + fl*3.1) > amount) continue;
    vec2 c = 0.3 + 0.4*hash22(cell + k*3.17), dv = f - c;
    float r = length(dv), size = 0.7 + 0.3*hash21(cell + k*5.3);       // drop size sets the ring size
    float R = (0.02 + ph*0.28)*size, fade = (1.0 - ph)*(1.0 - ph);
    float x1 = (r - R)/0.03, x2 = (r - R*0.6)/0.022, e1 = exp(-x1*x1), e2 = exp(-x2*x2);
    res.xy += dv/(r + 1e-4)*(-2.0*x1*e1 - 1.1*x2*e2)*0.12*fade;
    res.z += (e1 + 0.5*e2)*fade*0.45 + (1.0 - smoothstep(0.0, 0.04, r))*(1.0 - smoothstep(0.0, 0.1, ph));
  }
  return res;
}

vec3 sampleCaustics(vec2 uv){
  uv *= CAUSTICS_SCALE;
  return vec3(texture(uCaus, uv).r, texture(uCaus, uv + vec2(0.006,0.006)).r, texture(uCaus, uv + vec2(0.009,0.003)).r);   // Godot splits 0.02/0.03: rainbow fringes up close
}

void main(){
  vec2 p = uCam + vec2(vNdc.x*uHalf.x, vNdc.y*uHalf.y/uCosT);   // ground point under this pixel (tilted camera)
  float d = bankD(p);
  vec3 col;

  if (d > -0.3){
    /* ================= lake water =================
       Surface: fine wind ripples from six travelling wave trains (deep water dispersion,
       analytic slopes, so nothing tiles) plus the boat wake from the live simulation.
       Body: Beer-Lambert absorption over the light path through the water, so the sand
       turns turquoise, then teal, then sapphire on its own. The bed is seen through the
       rippled surface (refraction) with caustic lines. Top: Fresnel sky reflection with
       clouds and stars, sun glints on ripple crests, foam lapping at the shore.        */
    float D = depthAt(d);
    // ---- surface slope ----
    const vec3 TR[6] = vec3[6](vec3(0.89, 0.45, 1.9), vec3(-0.60, 0.80, 1.3), vec3(0.20, -0.98, 2.7),
                               vec3(-0.95, -0.31, 3.6), vec3(0.71, -0.71, 5.1), vec3(-0.25, 0.97, 7.3));
    vec2 g = vec2(0.0); float crest = 0.0;
    for (int i=0;i<6;i++){
      vec2 dir = normalize(TR[i].xy); float k = TR[i].z, w = sqrt(9.81*k);
      float ph = dot(dir, p)*k - w*uTime*0.6 + float(i)*1.7;
      g += dir*((0.006 + 0.0045*k)*cos(ph));                      // long swells stay flat, short ripples carry the detail
      if (i >= 3) crest += sin(ph);
    }
    float rough = mix(0.35, 1.0, smoothstep(0.25, 0.75, fbm(p*0.03 + vec2(uTime*0.012, -uTime*0.007))));   // calm slicks and rougher patches
    g *= rough*smoothstep(0.0, 1.2, D)*(1.0 + 0.8*uRain);            // wind with the rain roughens the lake
    vec3 drops = vec3(0.0);
    if (uRain > 0.003){
      drops = rainRings(p, uTime, pow(uRain, 0.8));
      // and a fine, shimmering stipple from the countless drops too small to ring
      drops.xy += (vec2(vnoise(p*6.0 + vec2(uTime*4.1, -uTime*3.3)), vnoise(p*6.0 + vec2(13.7 - uTime*3.7, uTime*4.4))) - 0.5)*0.07*uRain;
      g += drops.xy*smoothstep(0.0, 0.3, D);
    }
    vec2 simG = vec2(0.0);
    if (uHasSim > 0.5){
      float dx = uWorld/uSimN;
      simG = vec2(texture(uSim, (p+vec2(dx,0.0))/uWorld).r - texture(uSim, (p-vec2(dx,0.0))/uWorld).r,
                  texture(uSim, (p+vec2(0.0,dx))/uWorld).r - texture(uSim, (p-vec2(0.0,dx))/uWorld).r)/(2.0*dx);
      vec2 off = abs(p - uSimC);                                   // the height field wraps: fade it out before its edge
      simG *= 1.0 - smoothstep(uWorld*0.36, uWorld*0.46, max(off.x, off.y));
    }
    vec3 N = normalize(vec3(-(g + simG*0.9), 1.0));
    vec3 V = vec3(0.0, -uSinT, uCosT);
    // ---- the bed, seen through the surface ----
    vec2 bp = p + N.xy*clamp(D, 0.0, 2.5)*0.55;                    // refraction: deeper water bends more
    float Db = max(depthAt(bankD(bp)), 0.0);
    vec3 sand = toLinear(mix(vec3(0.60, 0.55, 0.40), vec3(0.72, 0.66, 0.48), vnoise(bp*0.22)));
    float c1 = texture(uCaus, bp*0.16 + vec2(uTime*0.02, uTime*0.013)).r;
    vec3 caus = pow(sampleCaustics(bp*0.34 + c1*0.05 + N.xy*0.15 - vec2(uTime*0.016, -uTime*0.01))*CAUSTICS_STRENGTH, vec3(2.0));
    vec3 sunIn = uAmbient + uLightCol*max(uLightDir.z, 0.0)*1.15;   // light reaching into the water
    vec3 bed = sand*sunIn + caus*0.45*uLightCol*exp(-Db*0.45);
    // ---- absorption and scattering ----
    vec3 absorb = vec3(0.45, 0.11, 0.065);                         // per meter, red goes first
    vec3 T = exp(-absorb*Db*2.0);                                  // down to the bed and back up
    vec3 scatter = toLinear(vec3(0.02, 0.24, 0.40))*sunIn;         // deep lake color
    vec3 body = bed*T + scatter*(1.0 - T);
    // ---- reflection ----
    vec3 R = reflect(-V, N);
    vec3 skyR = min(skyColor(vec3(R.x, R.z, -R.y)), vec3(1.0));
    float cl = cloudAt(p*0.6 + vec2(0.0, 40.0) + R.xy*25.0);
    skyR = mix(skyR, vec3(0.86)*(0.2 + 0.8*uDay), min(cl*2.5, 1.0)*0.45);
    if (uBlend < 0.0) skyR += smoothstep(0.9, 0.95, texture(uStars, p*0.012 + R.xy*0.15).r)*clamp(-uBlend*2.0, 0.0, 1.0)*0.9*(1.0 - uOvercast);
    skyR = mix(skyR, vec3(0.6, 0.64, 0.68)*(0.12 + 0.88*uDay), uOvercast*0.85);   // a grey overcast sky in the water
    float F = 0.02 + 0.98*pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 5.0);
    float refl = clamp(0.07 + F*1.5 + 0.14*(vNdc.y*0.5 + 0.5), 0.0, 0.5)*smoothstep(0.0, 0.35, D);
    vec3 lit = mix(body, toLinear(skyR), refl);
    // ---- sun (or moon) glints on ripple crests ----
    float tw = vnoise(p*2.3 + vec2(uTime*0.7, -uTime*0.5));
    float glint = smoothstep(2.5, 2.95, crest*rough)*smoothstep(0.7, 0.9, tw)*smoothstep(0.3, 1.2, D);
    lit += uLightCol*glint*mix(0.12, 3.0, uDay)*smoothstep(0.05, 0.3, uLightDir.z)*(1.0 - 0.9*uOvercast);
    lit += (sunIn + 0.04)*drops.z*0.3*smoothstep(0.0, 0.3, D);    // ring crests and splashes catch the light
    // ---- foam at the shore: lapping edge and ripples rolling in ----
    if (D < 1.5){                                                  // zero further out: skip two noise sums and two fetches
      float lap = 0.18 + 0.12*sin(uTime*0.9 + fbm(p*0.15)*6.0);
      float shape = texture(uFoam, p*0.35 + vec2(uTime*0.02, 0.0)).r;
      float foam = (1.0 - smoothstep(lap*0.5, lap, D))*smoothstep(0.25, 0.6, shape + 0.35);
      float rip = 0.5 + 0.5*sin(D*9.0 - uTime*2.2 + fbm(p*0.2)*4.0);
      float shape2 = texture(uFoam, p*0.5 + vec2(0.0, uTime*0.03)).r;
      foam = max(foam, smoothstep(0.72, 0.95, rip)*(1.0 - smoothstep(0.0, 1.5, D))*smoothstep(0.45, 0.8, shape2 + 0.1)*0.75);
      lit = mix(lit, vec3(0.9)*sunIn, foam*0.85);
    }
    lit *= cloudShade(p);
    col = toSrgb(lit);
  }

  /* ---- land ---- */
  if (d < 0.3){
    float bd = -d;
    float n1 = fbm(p*0.45), n2 = vnoise(p*3.0);
    vec3 sand = mix(vec3(0.74,0.66,0.46), vec3(0.83,0.76,0.56), n2);
    sand = mix(sand*0.68, sand, smoothstep(0.0, 0.7, bd));
    vec3 grass = palette(texture(uGroundNoise, p*0.1).r);            // ground.gdshader
    float gm = smoothstep(1.0, 2.3, bd + (n1-0.5)*1.7);
    vec3 land = mix(sand, grass, gm);
    land *= groundShade()*cloudShade(p)*mix(1.0, 0.7 + 0.12*gm, uWet);   // wet ground is darker, sand most
    float landMask = smoothstep(0.06, -0.06, d);
    col = d <= -0.3 ? land : mix(col, land, landMask);
  }
  vec3 hazeC = mix(mix(vec3(0.08,0.12,0.18), vec3(0.85,0.55,0.4), clamp(1.0 - abs(uBlend)*3.0, 0.0, 1.0)*step(-0.05, uBlend)), vec3(0.7,0.82,0.9), clamp(uBlend*2.5, 0.0, 1.0));
  col = mix(col, hazeC, smoothstep(0.1, 1.0, vNdc.y)*0.16);          // aerial haze toward the far edge
  col = mix(col, vec3(0.5, 0.55, 0.6)*(0.2 + 0.8*uDay), uRain*(0.1 + 0.14*smoothstep(-1.0, 1.0, vNdc.y)));   // rain haze
  col *= 1.0 - 0.22*dot(vNdc, vNdc)*0.5;                                        // soft vignette
  o = vec4(col, 1.0);
}`;


/* ---------------- grass: port of BinbunGrass grass.gdshader ----------------
   Instanced clumps standing on the land, drawn back to front. Same atlas, same
   world space color noise and palette as the ground, same dithered alpha cut.
   Changes for a top down 2D view:
     - Godot scatters 10,000 MultiMesh instances; here each instance is a grid
       cell around the camera with a hashed position, so grass is endless.
     - Billboards face the camera; here they stand up the screen.
     - Wind is off in the supplied material (velocity 0, 0); a light breeze is on here.
     - Clumps under tree shadow are darkened like the ground beneath them.  */
const GRASS_CELL = 0.3;
const grassVS = `#version 300 es
precision highp float;
uniform vec2 uCam, uHalf, uWindVel;
uniform float uCosT;
uniform ivec2 uOrigin; uniform int uCols;
uniform float uCell, uTime, uRandomVariation;
uniform sampler2D uGroundNoise, uWind;
out vec2 vUv; out vec2 vColorPos; out float vShade; flat out int vId;
${WORLD_GLSL}
${NOISE_GLSL}
void main(){
  int col = gl_InstanceID % uCols, row = gl_InstanceID / uCols;
  ivec2 cell = ivec2(uOrigin.x + col, uOrigin.y - row);     // rows run north to south: painter's order
  vec2 c = vec2(cell);
  vec2 h = hash22(c*1.37 + 11.0);
  vec2 base = (c + h)*uCell;
  float d = bankD(base);
  // fbm below is at most 0.875, so no clump can grow where d > -1.0: skip the rest (the lake is most of the view)
  if (d > -1.0){ vUv = vec2(0.0); vColorPos = vec2(0.0); vShade = 1.0; vId = 0; gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float n1 = fbm(base*0.45);
  float gm = smoothstep(1.0, 2.3, -d + (n1-0.5)*1.7);
  float scale = 0.3 + 1.7*hash21(c + 5.3);                  // Godot buffer scales span about 0 to 2
  if (gm < 0.5 + 0.4*hash21(c + 9.1)) scale = 0.0;           // only on grass, thinning out toward the sand
  float size = 0.4*scale;

  int v = gl_VertexID;                                      // two triangles
  vec2 corner = v==0 ? vec2(0,0) : v==1 ? vec2(1,0) : v==2 ? vec2(1,1) : v==3 ? vec2(0,0) : v==4 ? vec2(1,1) : vec2(0,1);
  vUv = vec2(corner.x, 1.0 - corner.y);                     // Godot quad UV: v = 0 at the top
  vec2 world = base + vec2((corner.x - 0.5)*size, corner.y*size*0.9);

  // wind(): noise scrolled by wind velocity, bending the top of the clump
  float wn = texture(uWind, world*0.03 - vec2(uTime*0.01)*uWindVel).r;
  world += wn*uWindVel*0.25*pow(1.0 - vUv.y, 2.0)*scale;

  vColorPos = vec2(base.x + (corner.x - 0.5)*size, base.y); // the clump's own ground position, as Godot sees world_pos.xz
  vShade = 1.0;
  int id = int(hash21(c + 2.2)*1024.0);
  vId = id;
  if (hash21(vec2(float(id), 1.0)) < uRandomVariation) vShade = -vShade;   // flag for the random lighter clump
  gl_Position = scale > 0.0 ? vec4((world.x - uCam.x)/uHalf.x, (world.y - uCam.y)*uCosT/uHalf.y, 0.0, 1.0) : vec4(2.0, 2.0, 2.0, 1.0);
}`;
const grassFS = `#version 300 es
precision highp float;
in vec2 vUv; in vec2 vColorPos; in float vShade; flat in int vId; out vec4 o;
uniform sampler2D uAtlas, uGroundNoise;
uniform float uCutStart, uCutEnd;
${LIGHT_GLSL}
${CLOUD_GLSL}
const vec3 PAL0 = vec3(0.658824, 0.792157, 0.345098), PAL1 = vec3(0.458824, 0.654902, 0.262745), PAL2 = vec3(0.274510, 0.509804, 0.196078);
vec3 palette(float t){
  if (t <= 0.166667) return PAL0;
  if (t <= 0.5) return mix(PAL0, PAL1, (t - 0.166667)/0.333333);
  if (t <= 0.833333) return mix(PAL1, PAL2, (t - 0.5)/0.333333);
  return PAL2;
}
float bayer4(vec2 frag){
  int x = int(mod(frag.x, 4.0)), y = int(mod(frag.y, 4.0));
  int m[16] = int[](0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5);
  return float(m[x + y*4])/16.0;
}
vec2 atlasUv(vec2 uv, int index, int size){
  int i = index % (size*size);
  vec2 tile = 1.0/vec2(float(size));
  return uv*tile + vec2(float(i % size), float(i / size))*tile;
}
void main(){
  float shape = texture(uAtlas, atlasUv(vUv, vId, 2)).r;
  float noiseValue = texture(uGroundNoise, vColorPos*0.1).r;
  if (vShade < 0.0) noiseValue += 0.4;
  vec3 color = palette(noiseValue)*abs(vShade)*groundShade()*cloudShade(vColorPos)*mix(1.0, 0.84, uWet);   // wet grass is darker
  // alpha_mode Dithered with alpha_cut 0.4 to 0.6, as in grass_01.tres
  float alpha = clamp((shape - uCutStart)/(uCutEnd - uCutStart), 0.0, 1.0);
  alpha = step(bayer4(gl_FragCoord.xy) + 0.01, alpha);
  if (alpha < 0.1) discard;
  o = vec4(color, 1.0);
}`;

/* ---------------- sprites: foam puffs, spray and water droplets ---------------- */
const SPR_VS = `#version 300 es
precision highp float;
in vec2 aWorld; in vec2 aLocal; in vec4 aP; in vec4 aQ;
uniform vec2 uCam, uHalf; uniform float uCosT;
out vec2 vLocal; out vec4 vP; out vec4 vQ;
void main(){ vLocal=aLocal; vP=aP; vQ=aQ; gl_Position=vec4((aWorld.x-uCam.x)/uHalf.x, (aWorld.y-uCam.y)*uCosT/uHalf.y, 0.0, 1.0); }`;

const SPR_FS = `#version 300 es
precision highp float;
in vec2 vLocal; in vec4 vP; in vec4 vQ; out vec4 o;
uniform vec3 uLitS;
${NOISE_GLSL}
void main(){
  int type = int(vP.y + 0.5);
  float seed = vP.z;
  vec2 q = vLocal;
  vec4 res;
  if (type == 13){                                   // a water droplet: small, clear, with a highlight
    vec2 n = q/vQ.x; float r = length(n);
    float a = (1.0 - smoothstep(0.55, 1.0, r))*vQ.z;
    vec3 c = mix(vec3(0.72, 0.88, 0.98), vec3(1.0), 1.0 - smoothstep(0.0, 0.55, length(n - vec2(-0.3, 0.3))));
    res = vec4(c, a);
  } else {                                                  // foam puff or spray mist (type 6)
    float r = length(q)/vQ.x;
    float n = vnoise(q*5.0/vQ.x + seed*20.0);
    float a = (1.0 - smoothstep(0.35, 1.0, r)) * (0.45 + 0.7*n) * vQ.z;
    res = vec4(0.97, 0.99, 1.0, clamp(a, 0.0, 1.0));
  }
  o = vec4(res.rgb*uLitS, res.a);
}`;

/* ---------------- meshes: boats and beach balls ----------------
   Instanced, lit by the dynamic sky, with planar shadows rendered into a
   shadow buffer and multiplied over the ground, water and grass.
   Each instance carries its own position, heading, scale, roll and pitch,
   so every beach ball (or every boat of one type) is a single draw call. */
const MESH_VS = `#version 300 es
precision highp float;
in vec3 aPos; in vec3 aNrm; in vec2 aUv;
in vec4 iA;          // x, y, z, rotation
in vec4 iB;          // scale, tint, roll, pitch
uniform vec2 uCam, uHalf; uniform float uSinT, uCosT, uShadow;
uniform vec3 uLightDir;
out vec2 vUv; out vec3 vN; out vec3 vW; out float vTint;
void main(){
  float c = cos(iA.w), s = sin(iA.w);
  vec3 p = aPos*iB.x, nn = aNrm;
  float cp = cos(iB.w), sp = sin(iB.w), cr = cos(iB.z), sr = sin(iB.z);   // pitch, then roll
  p = vec3(p.x, cp*p.y - sp*p.z, sp*p.y + cp*p.z); nn = vec3(nn.x, cp*nn.y - sp*nn.z, sp*nn.y + cp*nn.z);
  p = vec3(cr*p.x + sr*p.z, p.y, -sr*p.x + cr*p.z); nn = vec3(cr*nn.x + sr*nn.z, nn.y, -sr*nn.x + cr*nn.z);
  vec3 w = vec3(iA.x + c*p.x - s*p.y, iA.y + s*p.x + c*p.y, iA.z + p.z);
  vN = vec3(c*nn.x - s*nn.y, s*nn.x + c*nn.y, nn.z);
  vUv = aUv; vW = w; vTint = iB.y;
  if (uShadow > 0.5){                                          // flatten onto the ground along the light
    float lz = max(uLightDir.z, 0.35);
    vec2 g = w.xy - uLightDir.xy/lz*max(w.z, 0.0);
    gl_Position = vec4((g.x - uCam.x)/uHalf.x, (g.y - uCam.y)*uCosT/uHalf.y, 0.0, 1.0);
  } else {
    float depth = ((w.y - uCam.y)*uSinT - w.z*uCosT)/400.0;
    gl_Position = vec4((w.x - uCam.x)/uHalf.x, ((w.y - uCam.y)*uCosT + w.z*uSinT)/uHalf.y, depth, 1.0);
  }
}`;
const MESH_FS = `#version 300 es
precision highp float;

   The lake is divided into fixed 10 m cells; only the cells around the view are drawn, with
   up to 65 drops each (that many in a downpour, fewer in lighter rain). A drop's cell, its
   number and the clock give its landing spot, its fall time (larger drops fall faster) and
   its cycle: about a second of falling as a streak blurred by its speed, then a short splash

float rnd(uint x){ return float(hashU(x) >> 8)/16777216.0; }

function wxShower(k){
  if (wxCache.has(k)) return wxCache.get(k);
  const reg = wxRegime((k + 0.5)*WX_WIN), R = rng((SEED ^ 0x3c6ef372) + Math.imul(k, 0x2545f491));
  R(); R();
  const e = R() > smooth(0.4, 0.78, reg)*0.8 ? null : {
    start: k*WX_WIN + R()*WX_WIN*0.8, build: 60 + R()*180, hold: 30 + R()*270, clear: 60 + R()*150,
    peak: (0.15 + 0.85*Math.pow(R(), 1.1))*(0.5 + 0.5*smooth(0.45, 0.8, reg)), seed: R()*100 };
  if (wxCache.size > 64) wxCache.clear();
  wxCache.set(k, e);
  return e;
}
function wxAt(t){                                             // t: seconds of real time; returns [rain, cloud cover, regime]
  const reg = wxRegime(t), front = smooth(0.74, 0.9, reg);
  let cloud = smooth(0.28, 0.75, reg)*0.75;                     // clouds thicken slowly as a spell sets in
  let rain = front*(0.18 + 0.32*wxNoise(t, 900, 0x77f1))*(0.85 + 0.15*Math.sin(t*0.013));
  const k0 = Math.floor(t/WX_WIN);
  for (let k = k0 - 2; k <= k0 + 1; k++){
    const e = wxShower(k); if (!e) continue;
    const u = t - e.start, end = e.build + e.hold + e.clear;
    cloud = Math.max(cloud, smooth(-150, 0, u)*(1 - smooth(end, end + 150, u))*(0.45 + 0.55*Math.min(1, e.peak*1.4)));   // a shower's cloud leads and lingers
    if (u <= 0 || u >= end) continue;
    const env = u < e.build ? Math.pow(u/e.build, 1.6) : u < e.build + e.hold ? 1 : 1 - smooth(e.build + e.hold, end, u);
    rain = Math.max(rain, e.peak*env*(0.75 + 0.25*Math.sin(u*0.031 + e.seed)*Math.sin(u*0.011 + e.seed*1.7)));
  }
  return [rain, Math.max(cloud, Math.min(1, rain*1.4)), reg];
}
const RAIN_FORCED = QUERY.has('rain') ? Math.min(1, Math.max(0, +QUERY.get('rain') || 0)) : null;
const weather = { rain: 0, cloud: 0, wet: 0, regime: 0, gust: 1, forced: RAIN_FORCED };
function updateWeather(dt, first){
  const now = Date.now()/1000;
  let [r, c, reg] = wxAt(now);
  if (weather.forced !== null){ r = weather.forced; c = Math.min(1, r*1.4); }
  const k = first ? 1 : Math.min(1, dt/3);                    // ease, so a long frame never jumps the weather
  weather.rain += (r - weather.rain)*k; weather.cloud += (c - weather.cloud)*k; weather.regime = reg;
  weather.gust = 1 + 0.6*weather.rain*(wxNoise(now, 6, 0x9d1) - 0.5);   // gusts sway the rain every few seconds
  // the ground soaks up in a few minutes of rain and dries over about five
  weather.wet = first ? Math.min(1, r*2) : Math.min(1, Math.max(0, weather.wet + (weather.rain > 0.03 ? weather.rain*dt/60 : -dt/300)));
}

/* ---------------- dynamic sky: a full day every 10 minutes ----------------
   About 5 minutes of daylight, then about 5 of night. Colors are the Godot
   sky shader defaults; blend is its LIGHT0_DIRECTION.y (sun height).      */
const CYCLE = 600;
let skyClock = CYCLE*0.07;
const SKY = { sun: [0, 0, 1], dir: [0, 0, 1], col: [1, 1, 1], amb: [0.3, 0.3, 0.3], day: 1, shadow: 0.4, lit: [1, 1, 1] };
const C_SKY_DAY = [0.0, 0.3, 0.7], C_HOR_DAY = [0.75, 0.85, 0.85], C_HOR_SUNSET = [0.9, 0.4, 0.1];
const C_SKY_SUNSET = [0.15, 0.2, 0.4], C_HOR_NIGHT = [0.1, 0.15, 0.2], C_SKY_NIGHT = [0.05, 0.10, 0.15];
const mix3 = (a, b, t) => [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t];
function updateSky(dt){
  skyClock = (skyClock + dt) % CYCLE;
  const ph = skyClock/CYCLE*Math.PI*2;                       // 0 sunrise, pi/2 noon, pi sunset
  const sx = Math.cos(ph)*0.92, sy = -0.42, sz = Math.sin(ph), l = Math.hypot(sx, sy, sz);
  SKY.sun = [sx/l, sy/l, sz/l];
  const b = SKY.sun[2], c01 = Math.min(1, Math.max(0, b)), n4 = Math.min(1, Math.pow(Math.max(0, 1 + b), 4));
  const hor = mix3(C_HOR_NIGHT, mix3(C_HOR_SUNSET, C_HOR_DAY, c01), n4);
  const sky = mix3(C_SKY_NIGHT, mix3(C_SKY_SUNSET, C_SKY_DAY, c01), n4);
  const skyAmb = mix3(sky, hor, 0.35);
  SKY.day = smooth(-0.12, 0.3, b);
  SKY.amb = skyAmb.map(v => 0.05 + 0.15*SKY.day + v*0.3);
  if (b >= 0){ SKY.dir = SKY.sun; SKY.col = mix3([1.0, 0.5, 0.25], [1.0, 0.96, 0.88], smooth(0.0, 0.45, b)).map(v => v*0.82*smooth(-0.02, 0.2, b)); }
  else { SKY.dir = SKY.sun.map(v => -v); SKY.col = [0.5, 0.55, 0.7].map(v => v*0.3*smooth(-0.02, 0.2, -b)); }
  SKY.shadow = 0.32*smooth(0.0, 0.25, Math.abs(b))*(b >= 0 ? 1 : 0.5);
  const oc = weather.cloud;                                   // overcast: dim direct light, flat grey ambient, faint shadows
  if (oc > 0){
    SKY.col = SKY.col.map(v => v*(1 - 0.72*oc));
    const avg = (SKY.amb[0] + SKY.amb[1] + SKY.amb[2])/3;
    SKY.amb = SKY.amb.map((v, i) => (v + (avg*(i === 2 ? 1.06 : 1) - v)*0.6*oc)*(1 + 0.15*oc));
    SKY.shadow *= 1 - 0.85*oc;
  }
  SKY.lit = SKY.amb.map((a, i) => Math.pow(a + SKY.col[i]*Math.max(SKY.dir[2], 0), 0.4545));
}
function setLight(u){
  if (u.uLightDir) gl.uniform3fv(u.uLightDir, SKY.dir);
  if (u.uLightCol) gl.uniform3fv(u.uLightCol, SKY.col);
  if (u.uAmbient) gl.uniform3fv(u.uAmbient, SKY.amb);
  if (u.uSkyClock) gl.uniform1f(u.uSkyClock, time);
  if (u.uCloudWind) gl.uniform2f(u.uCloudWind, 0.5, 0.5);
  if (u.uDay) gl.uniform1f(u.uDay, SKY.day);
  if (u.uSunG) gl.uniform3f(u.uSunG, SKY.sun[0], SKY.sun[2], -SKY.sun[1]);
  if (u.uBlend) gl.uniform1f(u.uBlend, SKY.sun[2]);
  if (u.uOvercast) gl.uniform1f(u.uOvercast, weather.cloud);
  if (u.uWet) gl.uniform1f(u.uWet, weather.wet);
  if (u.uSinT) gl.uniform1f(u.uSinT, SIN_T);
  if (u.uCosT) gl.uniform1f(u.uCosT, COS_T);
  if (u.uLitS) gl.uniform3fv(u.uLitS, SKY.lit);
}
const SKY_TEX = [[cloudTex1, 'uCloud1'], [cloudTex2, 'uCloud2'], [starTex, 'uStars'], [night2Tex, 'uNight2']];
function bindSkyTextures(u, first){
  for (let i = 0; i < SKY_TEX.length; i++){
    const t = SKY_TEX[i][0], n = SKY_TEX[i][1];
    if (u[n]){ gl.activeTexture(gl.TEXTURE0 + first + i); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(u[n], first + i); }
  }
}

// Remove item i from an unordered list in constant time (draw order of puffs does not matter).
function dropAt(a, i){ const last = a.pop(); if (i < a.length) a[i] = last; }

const sparks = [];
// Water jet spray: ballistic droplets thrown from the pod nozzles (the rooster tail),
// slowed by air, pulled down by gravity, splashing back into the lake.
function updateSparks(dt){
  const drag = Math.exp(-dt*0.9);
  for (let i = sparks.length - 1; i >= 0; i--){
    const k = sparks[i]; k.life -= dt;
    k.vx *= drag; k.vy *= drag; k.vz -= 9.8*dt;
    k.x += k.vx*dt; k.y += k.vy*dt; k.z += k.vz*dt; k.size += dt*k.grow;
    if (k.z < 0 || k.life <= 0){
      if (k.z < 0 && Math.random() < 0.12 && lakeD(k.x, k.y) > 0) spawnFoam(k.x, k.y, k.vx*0.2, k.vy*0.2, 0.9 + Math.random()*0.6, 0.18 + Math.random()*0.15, 0.5);
      dropAt(sparks, i);
    }
  }
}
// bv: the boat the spray leaves, whose speed the droplets inherit in part
function throwSpray(x, y, ex, ey, speed, up, n, spread, size, bv){
  const bvx = bv ? bv.vx*0.25 : 0, bvy = bv ? bv.vy*0.25 : 0;
  for (let i=0;i<n && sparks.length < 1100;i++){
    const sp = speed*(0.65 + Math.random()*0.6), j = spread;
    const drop = Math.random() < 0.4;                          // 40% clear droplets, the rest soft spray
    sparks.push({ x, y, z: 0.15, vx: ex*sp + (Math.random()-0.5)*j*(drop ? 1.6 : 1) + bvx, vy: ey*sp + (Math.random()-0.5)*j*(drop ? 1.6 : 1) + bvy,
                  vz: up*(0.55 + Math.random()*(drop ? 0.9 : 0.6)), life: 2.5, max: 2.5, drop,
                  size: drop ? 0.035 + Math.random()*0.04 : size*(0.7 + Math.random()*0.6), grow: drop ? 0 : 0.25 + Math.random()*0.3, seed: Math.random() });
  }
}

/* ======================================================================
   Game state and physics
   ====================================================================== */
const boat = { x:0, y:0, th:0, vx:0, vy:0, w:0, steer:0, throttle:0, roll:0, pitch:0, boost:1, boosting:false, z:0, vz:0, strafe:0,
               jumpT:0, splash:0, splashSim:0, rs:0, spec: BOATS[0], running:false };
let state = 'ready';                 // ready | run
let time = 0;
const input = { up:false, down:false, left:false, right:false, boost:false, strafeL:false, strafeR:false };
const cam = { x:0, y:0, half:14, shake:0 };
const particles = [];

function resetGame(){
  boat.x = spawn.x; boat.y = spawn.y; boat.th = spawn.th; boat.vx = 0; boat.vy = 0; boat.w = 0;
  boat.steer = 0; boat.throttle = 0; boat.roll = 0; boat.pitch = 0; boat.boost = 1; boat.z = 0; boat.vz = 0; boat.strafe = 0; boat.jumpT = 0; boat.splash = 0;
  boat.running = false;
  spawnFloaters();
  particles.length = 0; sparks.length = 0;
  cam.x = boat.x; cam.y = boat.y + 5; cam.shake = 0;
  state = 'ready';
  el('start').classList.remove('hide');
  updateHud();
}
function startGame(){
  if (state !== 'ready') return;
  const u = baseFlow(boat.x, boat.y); boat.vx = u[0]; boat.vy = u[1];
  state = 'run'; boat.running = true;
  el('start').classList.add('hide');
}

const INERTIA = 0.64;
// A hull circle touching something: push out and bounce. Against another sailor's boat
// (other set) each side moves only its own boat and takes half the impulse, as for two
// boats of equal mass; the other client does the same, so the bump is symmetric.
function contact(wx, wy, n, pen, kind, other){
  const half = kind === 'boat' ? 0.5 : 1;
  boat.x += n[0]*pen*half; boat.y += n[1]*pen*half;
  const rx = wx - boat.x, ry = wy - boat.y;
  const vpx = boat.vx - boat.w*ry - (other ? other.vx : 0), vpy = boat.vy + boat.w*rx - (other ? other.vy : 0);
  const vn = vpx*n[0] + vpy*n[1];
  if (vn >= 0) return;
  const rn = rx*n[1] - ry*n[0];
  const e = kind === 'boat' ? 0.45 : 0.32;
  const j = -(1+e)*vn/(1 + rn*rn/INERTIA)*half;
  boat.vx += j*n[0]; boat.vy += j*n[1]; boat.w += j*rn/INERTIA;
  const tx = -n[1], ty = n[0], vt = vpx*tx + vpy*ty;           // scrape friction
  boat.vx -= tx*vt*0.12*half; boat.vy -= ty*vt*0.12*half;
  const impact = -vn;
  if (impact > 1.0){
    cam.shake = Math.min(1, Math.max(cam.shake, impact/7));
    throwSpray(wx, wy, n[0], n[1], impact*0.6, 1.2 + impact*0.3, Math.min(14, Math.floor(impact*3)), 1.4, 0.12, boat);
    for (let i=0;i<Math.min(8, impact*1.6);i++) spawnFoam(wx + (Math.random()-0.5)*0.6, wy + (Math.random()-0.5)*0.6, n[0]*impact*0.3 + (Math.random()-0.5)*2, n[1]*impact*0.3 + (Math.random()-0.5)*2, 1.2+Math.random(), 0.45, 0.6);
  }
}

function stepBoat(dt, controlled){
  const b = boat, sp = b.spec;
  const u = baseFlow(b.x, b.y);
  const fx = -Math.sin(b.th), fy = Math.cos(b.th), nx = Math.cos(b.th), ny = Math.sin(b.th);
  const rvx = b.vx - u[0], rvy = b.vy - u[1];
  const vf = rvx*fx + rvy*fy, vl = rvx*nx + rvy*ny;
  const thr = controlled ? b.throttle : 0;
  const thrust = thr > 0 ? thr*sp.thrust*(b.boosting ? sp.boost : 1) : 0;   // no reverse: S only brakes
  const air = b.z > 0.001 || b.vz > 0;
  const wet = air ? 0.08 : 1;                                  // airborne: almost no water drag or grip
  const Ff = (air ? 0 : thrust) - (sp.lin + sp.quad*Math.abs(vf) + (thr < 0 ? -thr*2.2 : 0))*vf*wet;   // long axis: slippery
  const strafe = controlled && !air ? b.strafe : 0;            // pods turned sideways slide the boat
  const grip = sp.grip*(b.boosting ? 0.57 : 1)*(Math.abs(strafe) > 0.1 ? 0.3 : 1);   // boosting or strafing loosens the keel
  const Fl = 7.5*strafe - (grip + 0.8*Math.abs(vl))*vl*wet;
  b.vx += (Ff*fx + Fl*nx)*dt; b.vy += (Ff*fy + Fl*ny)*dt;
  if (air){
    b.z += b.vz*dt; b.vz -= 17*dt;
    if (b.z <= 0){ b.z = 0; if (b.vz < -1) b.splash = Math.min(1.5, -b.vz/6); b.vz = 0; }
  }
  const rudder = Math.min(1, (Math.abs(vf) + Math.abs(thrust)*0.6)/4);
  const dir = vf < -0.4 ? -1 : 1;
  // jets give steering even when slow; at speed the rudder takes over and yaw is capped so turns stay controllable
  const torque = (controlled ? b.steer : 0) * (air ? 0.3 : 1) * (sp.turn * (0.45 + 0.55*rudder) * dir + (Math.abs(b.throttle) < 0.2 ? 3.2 : 0)) * (1 - 0.25*Math.min(1, Math.abs(vf)/10)) - 3.1*b.w - 0.3*vl*(vf >= 0 ? 1 : -1);
  b.w += torque*dt;
  b.x += b.vx*dt; b.y += b.vy*dt; b.th += b.w*dt;

  const c = Math.cos(b.th), s = Math.sin(b.th);
  for (const [lx, ly] of sp.hull){
    const wx = b.x + lx*c - ly*s, wy = b.y + lx*s + ly*c;
    const bd = bankDist(wx, wy) - sp.hullR;
    if (bd < 0) contact(wx, wy, bankNormal(wx, wy), -bd, 'bank');
    if (b.z > 0.5) continue;                                   // jumping over another boat clears it
    for (const r of remotes.values()){
      if (!r.shown || r.z > 0.5 || Math.abs(r.x - wx) > 6 || Math.abs(r.y - wy) > 6) continue;
      const rc = Math.cos(r.th), rsn = Math.sin(r.th);
      for (const [mx, my] of r.spec.hull){
        const ox = r.x + mx*rc - my*rsn, oy = r.y + mx*rsn + my*rc;
        const dx = wx - ox, dy = wy - oy, dist = Math.hypot(dx, dy), pen = sp.hullR + r.spec.hullR - dist;
        if (pen > 0 && dist > 1e-5) contact(wx, wy, [dx/dist, dy/dist], pen, 'boat', r);
      }
    }
  }
}

const floaters = [];
function spawnFloaters(){
  const R = rng(SEED ^ 0xbeef);
  floaters.length = 0;
  for (let t = 0; t < 900 && floaters.length < 46; t++){
    const th = R()*Math.PI*2, ri = islandR(th), ro = outerR(th), r = ri + 6 + R()*(ro - ri - 12);
    const x = Math.cos(th)*r, y = Math.sin(th)*r;
    if (bankDist(x, y) < 4 || Math.hypot(x - spawn.x, y - spawn.y) < 10) continue;
    if (floaters.some(f => Math.hypot(f.x - x, f.y - y) < 3)) continue;
    const br = [0.42, 0.42, 0.42, 0.42, 0.75, 0.75, 1.2, 1.8][Math.floor(R()*8)];
    if (floaters.some(f => Math.hypot(f.x - x, f.y - y) < f.r + br + 2)) continue;
    floaters.push({ x, y, vx: 0, vy: 0, r: br, m: 0.08*(br/0.42)*(br/0.42), seed: R(), spin: R()*Math.PI*2, rx: R()*6, ry: R()*6 });
  }
}
// Beach balls drift with the current and a breeze, roll, bump each other, and are shoved by
// every hull: yours (which they push back on) and the other sailors' (which they cannot move).
// Each player keeps their own copy of the balls, so the balls can differ between screens.
const pushers = [];
function updateFloaters(dt){
  pushers.length = 0; pushers.push(boat);
  for (const r of remotes.values()) if (r.shown) pushers.push(r);
  for (const f of floaters){
    const u = baseFlow(f.x, f.y), k = Math.min(1, dt*0.9), wa = time*0.013 + 1.3;
    const br = 0.3 + 0.7*weather.rain, wx = u[0] + Math.cos(wa)*br, wy = u[1] + Math.sin(wa)*br;   // current plus a breeze that freshens in rain
    f.vx += (wx - f.vx)*k; f.vy += (wy - f.vy)*k;
    f.x += f.vx*dt; f.y += f.vy*dt;
    f.rx += f.vy*dt/f.r; f.ry -= f.vx*dt/f.r;                   // roll as they move
    const d = lakeD(f.x, f.y) - f.r;
    if (d < 0){ const n = bankNormal(f.x, f.y), vn = f.vx*n[0] + f.vy*n[1]; f.x -= n[0]*d; f.y -= n[1]*d; if (vn < 0){ f.vx -= 1.6*vn*n[0]; f.vy -= 1.6*vn*n[1]; } }
    for (const b of pushers){
      if (Math.abs(f.x - b.x) > 6 || Math.abs(f.y - b.y) > 6 || b.z > f.r*2) continue;
      const c = Math.cos(b.th), s = Math.sin(b.th), mine = b === boat;
      for (const [lx, ly] of b.spec.hull){
        const hx = b.x + lx*c - ly*s, hy = b.y + lx*s + ly*c;
        const dx = f.x - hx, dy = f.y - hy, dist = Math.hypot(dx, dy), pen = f.r + b.spec.hullR - dist;
        if (pen <= 0 || dist < 1e-5) continue;
        const nx = dx/dist, ny = dy/dist;
        f.x += nx*pen; f.y += ny*pen;
        const rel = (f.vx - b.vx)*nx + (f.vy - b.vy)*ny;
        if (rel < 0){
          const j = -1.7*rel/(1/f.m + (mine ? 1 : 0));          // a beach ball weighs almost nothing (big ones a bit more)
          f.vx += nx*j/f.m; f.vy += ny*j/f.m;
          if (mine){ boat.vx -= nx*j; boat.vy -= ny*j; }
          if (-rel > 2) throwSpray(f.x, f.y, nx, ny, -rel*0.5, 1.5 + -rel*0.25, Math.min(16, Math.floor(-rel*2)), 1.2, 0.12, b);
          if (-rel > 2) for (let i=0;i<5;i++) spawnFoam(f.x, f.y, nx*2 + (Math.random()-0.5)*2, ny*2 + (Math.random()-0.5)*2, 0.9, 0.35, 0.7);
        }
      }
    }
  }
  for (let i=0;i<floaters.length;i++) for (let j=i+1;j<floaters.length;j++){   // balls bump each other
    const a = floaters[i], b = floaters[j], dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) continue;
    const dist = Math.hypot(dx, dy), pen = a.r + b.r - dist;
    if (pen <= 0 || dist < 1e-5) continue;
    const nx = dx/dist, ny = dy/dist, wa = b.m/(a.m + b.m), wb = a.m/(a.m + b.m);
    a.x -= nx*pen*wa; a.y -= ny*pen*wa; b.x += nx*pen*wb; b.y += ny*pen*wb;
    const rel = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;
    if (rel < 0){ const j = -1.6*rel/(1/a.m + 1/b.m); a.vx -= nx*j/a.m; a.vy -= ny*j/a.m; b.vx += nx*j/b.m; b.vy += ny*j/b.m; }
  }
}

// Where each stern pod of boat b points its jet and how hard. Both pods sit on the transom;
// nothing fires from the bow. dir is the jet's frame angle (exhaust along (sin dir, -cos dir)).
function thrusterState(b, side){
  const sp = b.spec, fx = -Math.sin(b.th), fy = Math.cos(b.th), rx = Math.cos(b.th), ry = Math.sin(b.th);
  const back = 0.31 - sp.y0;
  const t = { x: b.x + rx*side*sp.podX - fx*back, y: b.y + ry*side*sp.podX - fy*back, dir: b.th, open: 0, down: b.jumpT > 0 ? b.jumpT/0.35 : 0 };
  if (t.down > 0) return t;
  const thr = b.throttle;
  if (Math.abs(b.strafe) > 0.1){ t.dir = b.th - b.strafe*Math.PI/2; t.open = Math.abs(b.strafe)*0.7; }
  else if (Math.abs(thr) < 0.15 && Math.abs(b.steer) > 0.2){                  // spin in place: one pushes, one reverses
    if (Math.sign(b.steer) !== side) return t;
    t.dir = b.th; t.open = Math.abs(b.steer)*0.6;
  } else if (thr < -0.05){ t.open = 0; }                     // braking: jets off
  else { t.dir = b.th - b.steer*0.3; t.open = Math.max(0, thr)*(b.boosting ? 1.25 : 0.85) + (b.running ? 0.12 : 0.06); }
  return t;
}
function jump(){                                              // pods fire straight down: the boat leaves the water
  if (state !== 'run' || boat.z > 0.01 || boat.boost < 0.3) return;
  boat.vz = 6.5; boat.z = 0.001; boat.boost -= 0.3; boat.jumpT = 0.35;
  jumpBurst(boat);
}
function jumpBurst(b){
  for (let i=0;i<16;i++){ const a = Math.random()*Math.PI*2; throwSpray(b.x, b.y, Math.cos(a), Math.sin(a), 4, 3, 5, 1.5, 0.22, b); }
  for (let i=0;i<18;i++){ const a = Math.random()*Math.PI*2; spawnFoam(b.x + Math.cos(a)*0.9, b.y + Math.sin(a)*1.3, Math.cos(a)*3, Math.sin(a)*3, 1.0, 0.5, 0.85); }
}

// Wake foam, jet spray and landing splashes for any boat: yours or another sailor's.
function boatEffects(b, dt){
  const u = baseFlow(b.x, b.y), rvx = b.vx - u[0], rvy = b.vy - u[1], rs = Math.hypot(rvx, rvy);
  b.rs = rs;
  const fx = -Math.sin(b.th), fy = Math.cos(b.th), nx = Math.cos(b.th), ny = Math.sin(b.th);
  if (b.z < 0.05){
    let nspawn = Math.floor((rs*5 + Math.abs(b.throttle)*14)*dt + Math.random());
    while (nspawn-- > 0){
      const jit = (Math.random()-0.5)*0.5;
      spawnFoam(b.x - fx*1.5 + nx*jit, b.y - fy*1.5 + ny*jit, u[0] - fx*0.8 + nx*jit*2, u[1] - fy*0.8 + ny*jit*2, 2.0+Math.random()*1.6, 0.30+Math.random()*0.25, 0.55);
    }
    if (rs > 2.5 && Math.random() < dt*rs*3){                 // bow spray
      const side = Math.random() < 0.5 ? -1 : 1;
      spawnFoam(b.x + fx*0.9 + nx*0.55*side, b.y + fy*0.9 + ny*0.55*side, u[0] + nx*side*1.1, u[1] + ny*side*1.1, 1.1+Math.random()*0.7, 0.22+Math.random()*0.15, 0.7);
    }
  }
  for (const side of [-1, 1]){                                // water jets: rooster tail and white water at each pod
    const t = thrusterState(b, side), ex = Math.sin(t.dir), ey = -Math.cos(t.dir);
    if (t.down > 0){ throwSpray(t.x, t.y, 0, 0, 0, 5.5, Math.floor(120*dt) + 1, 5, 0.25, b); continue; }
    if (t.open < 0.13 || b.z > 0.05) continue;
    const reversing = Math.abs(((t.dir - b.th) % (2*Math.PI) + 3*Math.PI) % (2*Math.PI) - Math.PI) > 2.2;
    const up = reversing ? 1.6 + 2.0*t.open : 1.2 + 5.2*t.open*t.open + (b.boosting ? 1.6 : 0);
    throwSpray(t.x, t.y, ex, ey, 3 + 6.5*t.open, up, Math.floor(t.open*100*dt + Math.random()), 0.7 + 0.8*t.open, 0.13 + 0.12*t.open, b);
    if (Math.random() < t.open*dt*30) spawnFoam(t.x + ex*0.3, t.y + ey*0.3, ex*2 + b.vx*0.3, ey*2 + b.vy*0.3, 1.6 + Math.random(), 0.32 + 0.2*t.open, 0.75);   // churned white water
  }
  if (b.splash > 0){                                          // landing after a jump
    for (let i=0;i<26*b.splash;i++){ const a = Math.random()*Math.PI*2, r = 0.6 + Math.random()*0.8; spawnFoam(b.x + Math.cos(a)*r, b.y + Math.sin(a)*r*1.4, Math.cos(a)*4*b.splash, Math.sin(a)*4*b.splash, 1.4, 0.55, 0.9); }
    for (let i=0;i<12;i++){ const a = Math.random()*Math.PI*2; throwSpray(b.x, b.y, Math.cos(a), Math.sin(a), 3*b.splash, 3.5*b.splash, 6, 1.5, 0.2, b); }
    if (b === followed()) cam.shake = Math.max(cam.shake, 0.35*b.splash);
    b.splashSim = b.splash; b.splash = 0;
  }
}

/* ---------- foam particles (carried along by the current) ---------- */
function spawnFoam(x, y, vx, vy, life, size, alpha){
  if (particles.length > 320) dropAt(particles, Math.floor(Math.random()*particles.length));
  particles.push({ x, y, vx, vy, life, max:life, size, alpha, seed:Math.random() });
}
function updateParticles(dt){
  const k = Math.min(1, dt*1.6);
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.life -= dt;
    if (p.life <= 0 || lakeD(p.x, p.y) < -0.3){ dropAt(particles, i); continue; }
    const u = baseFlow(p.x, p.y);
    p.vx += (u[0]-p.vx)*k; p.vy += (u[1]-p.vy)*k;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

/* ---------- wave simulation driver ----------
   The height field is centred on the boat the camera follows. Every boat near
   that centre (nearest first) disturbs the water, then moving beach balls.    */
let simAcc = 0;
const simC = { x: 0, y: 0 };
function hullSources(b, src){
  const fx = -Math.sin(b.th), fy = Math.cos(b.th), nx = Math.cos(b.th), ny = Math.sin(b.th);
  const k = Math.min(1.3, b.rs/7)*(b.z < 0.05 ? 1 : 0);
  if (b.splashSim > 0) src.push([b.x, b.y, 1.3, 0.12*b.splashSim]);
  src.push([b.x + fx*1.15, b.y + fy*1.15, 0.42, 0.014*k]);                 // bow pushes water up
  src.push([b.x + fx*0.2 + nx*0.5, b.y + fy*0.2 + ny*0.5, 0.35, -0.006*k]); // low pressure along the flanks
  src.push([b.x + fx*0.2 - nx*0.5, b.y + fy*0.2 - ny*0.5, 0.35, -0.006*k]);
  src.push([b.x - fx*1.2, b.y - fy*1.2, 0.40, -0.010*k]);                  // stern draws water in
  for (const side of [-1, 1]){ const t = thrusterState(b, side); if (t.open > 0.13) src.push([t.x + Math.sin(t.dir)*0.6, t.y - Math.cos(t.dir)*0.6, 0.35, 0.016*t.open*Math.sin(time*31 + side)]); }   // jet churn
}
function gatherSources(){
  const src = [], near = [];
  for (const b of pushers){ const d = Math.hypot(b.x - simC.x, b.y - simC.y); if (d < 40) near.push([d, b]); }
  near.sort((a, b) => a[0] - b[0]);
  for (const [, b] of near){ if (src.length > MAX_SRC - 7) break; hullSources(b, src); }
  for (const b of pushers) b.splashSim = 0;
  for (const f of floaters){
    if (src.length >= MAX_SRC) break;
    const sp = Math.hypot(f.vx, f.vy);
    if (sp > 0.6 && Math.hypot(f.x - simC.x, f.y - simC.y) < 30) src.push([f.x, f.y, 0.4, 0.01*Math.min(sp, 6)*Math.sin(time*9 + f.seed*30)]);
  }
  return src;
}
const simSrc = new Float32Array(MAX_SRC*4);
function simStep(src){
  gl.bindFramebuffer(gl.FRAMEBUFFER, sim.fbo[sim.w]);
  gl.viewport(0, 0, SIM_N, SIM_N);
  gl.useProgram(simProg);
  gl.bindVertexArray(emptyVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.tex[sim.r]);
  const u = simProg.u, n = Math.min(src.length, MAX_SRC);
  gl.uniform1i(u.uState, 0);
  gl.uniform1f(u.uN, SIM_N); gl.uniform1f(u.uWorld, SIM_WORLD); gl.uniform1f(u.uDt, SIM_DT); gl.uniform1f(u.uC2, SIM_C2);
  gl.uniform2f(u.uCam, simC.x, simC.y);
  simSrc.fill(0); for (let i=0;i<n;i++) simSrc.set(src[i], i*4);
  gl.uniform4fv(u.uSrc, simSrc);
  gl.uniform1i(u.uCount, n);
  gl.disable(gl.BLEND);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const t = sim.r; sim.r = sim.w; sim.w = t;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function clearSim(){                                          // calm water when the camera jumps to another boat
  if (!simOK) return;
  gl.clearColor(0, 0, 0, 0);
  for (const fb of sim.fbo){ gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.clear(gl.COLOR_BUFFER_BIT); }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* Away after 5 minutes without a key, click or touch: you leave the other sailors' list and stop
   sending, but still see them (watching counts as away). Any input brings you back at once. */
const AWAY_MS = 5*60*1000;
let lastInput = Date.now(), away = false;
function markActive(){
  lastInput = Date.now();
  if (!away) return;
  away = false; net.sendAcc = 1;
  if (net.joined) netTrack();
}
setInterval(() => {

['keydown', 'pointerdown', 'pointermove', 'wheel'].forEach(t => addEventListener(t, markActive, { passive: true }));

function setName(v){

  myName = n;
  try { localStorage.setItem('riverrun.name', n); } catch(e) {}
  net.sendAcc = 1;
  if (net.joined && !away) netTrack();                        // others see the new name straight away
}
function netRaw(m){ if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(m)); }
function netPush(event, payload, ref){ netRaw({ topic: NET_TOPIC, event, payload, ref: ref || null, join_ref: net.joinRef }); }
function netDrop(){

function netRetry(){ clearTimeout(net.timer); net.timer = setTimeout(netConnect, Math.min(30, 2 ** net.retry++)*1000); }
function netMessage(m){

  if (m.event === 'presence_state'){ for (const k in p) presenceJoin(k, p[k]); return; }
  if (m.event === 'presence_diff'){
    const joins = p.joins || {};
    for (const k in joins) presenceJoin(k, joins[k]);
    for (const k in (p.leaves || {})) if (!(k in joins)) presenceLeave(k);   // a rename arrives as a join plus a leave
    return;
  }
  if (m.event === 'phx_reply' && m.ref === net.joinRef){
    if (p.status === 'ok'){
      net.joined = true; net.status = 'on'; net.retry = 0; net.sendAcc = 1;
      if (!away) netTrack();
    } else { net.status = 'refused'; try { net.ws.close(); } catch(e) {} }
    return;
  }
  if (m.event === 'phx_error' || m.event === 'phx_close'){ try { net.ws.close(); } catch(e) {} }
}
function presenceJoin(k, v){

function presenceLeave(k){

  const r = remotes.get(k); if (r){ removeTag(r); remotes.delete(k); }
  if (watching === k) setWatching(null, true);
}
const NUM_FIELDS = 15;              // x, y, heading, z, vz, vx, vy, yaw rate, roll, pitch, throttle, steer, strafe, boat, flags
const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const wrapAngle = a => a - 2*Math.PI*Math.round(a/(2*Math.PI));
function remoteState(p){
  if (!p || typeof p.i !== 'string' || p.i === myId || p.i.length > 32 || !Array.isArray(p.d) || p.d.length !== NUM_FIELDS) return;
  const d = p.d;
  for (let k=0;k<NUM_FIELDS;k++) if (typeof d[k] !== 'number' || !isFinite(d[k])) return;
  if (Math.abs(d[0]) > 400 || Math.abs(d[1]) > 400) return;
  let r = remotes.get(p.i);
  if (!r){
    if (remotes.size >= 24) return;
    r = { id: p.i, name: '', b: 0, spec: BOATS[0], x: d[0], y: d[1], th: d[2], z: 0, vz: 0, vx: 0, vy: 0, w: 0, roll: 0, pitch: 0,
          throttle: 0, steer: 0, strafe: 0, boosting: false, running: false, jumpT: 0, splash: 0, splashSim: 0, rs: 0,
          t: { x: d[0], y: d[1], th: d[2], z: 0, vz: 0, vx: 0, vy: 0, w: 0 }, last: 0, shown: false, tag: null, phase: Math.random()*6.28 };
    remotes.set(p.i, r);
  }
  const t = r.t, b = clampN(Math.round(d[13]), 0, BOATS.length - 1);
  r.b = b; r.spec = BOATS[b];
  r.name = cleanName(p.n) || online.get(p.i) || 'Sailor';
  if (!online.has(p.i) && online.size < 32) online.set(p.i, r.name);   // a message proves they are here, even before presence says so
  t.x = d[0]; t.y = d[1]; t.th = r.th + wrapAngle(d[2] - r.th);
  t.z = clampN(d[3], 0, 20); t.vz = clampN(d[4], -40, 40);
  t.vx = clampN(d[5], -60, 60); t.vy = clampN(d[6], -60, 60); t.w = clampN(d[7], -20, 20);
  r.roll = clampN(d[8], -1, 1); r.pitch = clampN(d[9], -1, 1);
  r.throttle = clampN(d[10], -1, 1); r.steer = clampN(d[11], -1, 1); r.strafe = clampN(d[12], -1, 1);
  const f = d[14]|0;
  r.boosting = !!(f & 1); r.running = !!(f & 2);
  if ((f & 4) && r.jumpT <= 0 && r.z < 0.05){ r.jumpT = 0.35; r.wantBurst = true; }
  if (!r.shown){ r.x = t.x; r.y = t.y; r.th = t.th; r.z = t.z; }       // first sight, or back after a silence: no slide in
  r.last = performance.now(); r.shown = true;
  net.recv++;
}
// Predict each sailor forward from their last message, then ease the drawn boat toward that.
function updateRemotes(dt){
  const now = performance.now(), k = 1 - Math.exp(-dt*10);
  for (const [id, r] of remotes){
    const age = now - r.last;
    if (age > 6000){                                          // silent (tab hidden or connection lost): hide, then forget
      r.shown = false;
      if (age > 20000 && !online.has(id)){ removeTag(r); remotes.delete(id); }
      if (watching === id) setWatching(null, true);
      continue;
    }
    const t = r.t;
    if (age < 1000){ t.x += t.vx*dt; t.y += t.vy*dt; t.th += t.w*dt; }
    if (t.z > 0 || t.vz > 0){
      t.z += t.vz*dt; t.vz -= 17*dt;
      if (t.z <= 0){ if (t.vz < -1) r.splash = Math.min(1.5, -t.vz/6); t.z = 0; t.vz = 0; }
    }
    if (Math.hypot(t.x - r.x, t.y - r.y) > 12){ r.x = t.x; r.y = t.y; r.th = t.th; }
    else { r.x += (t.x - r.x)*k; r.y += (t.y - r.y)*k; r.th += wrapAngle(t.th - r.th)*k; }
    r.z += (t.z - r.z)*Math.min(1, dt*20);
    r.vx = t.vx; r.vy = t.vy; r.w = t.w; r.vz = t.vz;
    r.jumpT = Math.max(0, r.jumpT - dt);
    if (r.wantBurst){ r.wantBurst = false; jumpBurst(r); }
  }
}
function netSend(dt){
  if (!net.joined || !online.size || away) return;           // alone on the lake, or away: send nothing
  const n = online.size + 1;
  const busy = Math.hypot(boat.vx, boat.vy) > 0.05 || Math.abs(boat.w) > 0.02 || boat.z > 0 || Math.abs(boat.throttle) > 0.02
            || Math.abs(boat.steer) > 0.05 || Math.abs(boat.strafe) > 0.05 || boat.jumpT > 0;
  const hz = busy ? clampN(60/(n*(n - 1)), 1, 10) : 1;        // keeps a crowd under about 60 deliveries a second
  net.sendAcc += dt;
  if (net.sendAcc < 1/hz) return;
  net.sendAcc = 0;
  const r2 = v => Math.round(v*100)/100, r3 = v => Math.round(v*1000)/1000;
  const flags = (boat.boosting ? 1 : 0) | (state === 'run' ? 2 : 0) | (boat.jumpT > 0 ? 4 : 0);

    r2(boat.x), r2(boat.y), r3(wrapAngle(boat.th)), r3(boat.z), r2(boat.vz), r2(boat.vx), r2(boat.vy), r3(boat.w),
    r3(boat.roll), r3(boat.pitch), r2(boat.throttle), r2(boat.steer), r2(boat.strafe), boatIndex, flags] } });
