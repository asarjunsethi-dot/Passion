}

/* ---------- watching other sailors ---------- */
function followed(){
  if (!watching) return boat;
  const r = remotes.get(watching);
  return r && r.shown ? r : boat;
}
function setWatching(id, quiet){
  if (watching === id) return;
  watching = id; clearSim();
  const r = id && remotes.get(id);
  if (!quiet) toast(r ? 'watching ' + r.name : 'your boat');
}
function cycleWatch(){
  const ids = [...remotes.values()].filter(r => r.shown).map(r => r.id);
  if (!ids.length){ setWatching(null, true); toast('no other sailors right now'); return; }
  const i = watching ? ids.indexOf(watching) : -1;
  setWatching(i + 1 < ids.length ? ids[i + 1] : null);
}

/* ---------- main update ---------- */
function update(dt){
  time += dt;
  updateWeather(dt);
  updateSky(dt);
  updateSparks(dt);
  const target = (input.up ? 1 : 0) - (input.down ? 1 : 0);
  const steerT = (input.left ? 1 : 0) - (input.right ? 1 : 0);
  boat.throttle += (target - boat.throttle)*Math.min(1, dt*(Math.abs(target) > Math.abs(boat.throttle) ? 4 : 7));
  boat.steer    += (steerT - boat.steer)*Math.min(1, dt*(steerT === 0 ? 10 : 7));
  boat.boosting = input.boost && boat.boost > 0.02 && boat.throttle > 0.3 && state === 'run';
  boat.boost = Math.min(1, Math.max(0, boat.boost + (boat.boosting ? -0.32 : 0.14)*dt));
  boat.strafe += (((input.strafeR ? 1 : 0) - (input.strafeL ? 1 : 0)) - boat.strafe)*Math.min(1, dt*8);
  boat.jumpT = Math.max(0, boat.jumpT - dt);

  updateRemotes(dt);
  if (state === 'ready'){
    boat.vx = boat.vy = boat.w = 0;                           // moored at the start line
  } else {
    const n = Math.max(1, Math.ceil(dt/(1/120))), h = dt/n;
    for (let i=0;i<n;i++) stepBoat(h, true);
  }

  // the hull banks into turns and lifts its bow with speed
  const u = baseFlow(boat.x, boat.y), fx = -Math.sin(boat.th), fy = Math.cos(boat.th);
  const vfwd = (boat.vx - u[0])*fx + (boat.vy - u[1])*fy;
  boat.roll  += (-boat.steer*Math.min(1, Math.abs(vfwd)/6)*0.14 - boat.w*0.02 - boat.roll)*Math.min(1, dt*4);
  boat.pitch += (0.05*Math.min(1, Math.max(0, vfwd)/8) + 0.035*Math.max(0, boat.throttle) + (boat.boosting ? 0.03 : 0) + boat.vz*0.025 - boat.pitch)*Math.min(1, dt*3);

  // wake, jets and splashes: your boat always, other sailors when near the camera
  boatEffects(boat, dt);
  const ex = cam.half*canvas.width/Math.max(1, canvas.height) + 15, ey = cam.half/COS_T + 15;
  for (const r of remotes.values()) if (r.shown && Math.abs(r.x - cam.x) < ex && Math.abs(r.y - cam.y) < ey) boatEffects(r, dt);
  updateParticles(dt);
  updateFloaters(dt);

  // wave simulation, centred on the boat the camera follows
  const f = followed();
  simC.x = f.x; simC.y = f.y;
  if (simOK){
    simAcc += dt; let steps = 0;
    while (simAcc >= SIM_DT && steps < 2){ simStep(gatherSources()); simAcc -= SIM_DT; steps++; }
    if (simAcc > SIM_DT*2) simAcc = 0;     // a slow frame drops sim time rather than doing more work
  }

  // camera
  const speed = Math.hypot(f.vx, f.vy);
  const aspect = canvas.width/Math.max(1, canvas.height);
  const halfT = Math.max(14 + speed*0.5, 11/aspect);
  cam.half += (halfT - cam.half)*(1 - Math.exp(-dt*1.6));
  const tx = f.x + f.vx*0.45, ty = f.y + 2.5 + f.vy*0.5;     // look further ahead along the travel direction
  if (Math.hypot(tx - cam.x, ty - cam.y) > 60){ cam.x = tx; cam.y = ty; }   // a cut, not a long pan across the lake
  const kk = 1 - Math.exp(-dt*3.6);                           // a softer follow
  cam.x += (tx - cam.x)*kk; cam.y += (ty - cam.y)*kk;
  cam.shake = Math.max(0, cam.shake - dt*2.2);

  netSend(dt);
  updateHud();
}

/* ---------- rendering ---------- */
function drawScene(){
  const aspect = canvas.width/canvas.height;
  const sh = cam.shake*cam.shake*0.5;
  const camX = cam.x + (Math.random()-0.5)*sh, camY = cam.y + (Math.random()-0.5)*sh;
  const halfX = cam.half*aspect, halfY = cam.half, gHalfY = halfY/COS_T;

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearDepth(1); gl.clearStencil(0); gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);

  // 2. water and ground
  gl.useProgram(waterProg); gl.bindVertexArray(emptyVao);
  const w = waterProg.u;
  gl.uniform2f(w.uCam, camX, camY); gl.uniform2f(w.uHalf, halfX, halfY);
  gl.uniform1f(w.uTime, time); gl.uniform1f(w.uWorld, SIM_WORLD); gl.uniform1f(w.uSimN, SIM_N);
  gl.uniform1f(w.uHasSim, simOK ? 1 : 0); gl.uniform2f(w.uSimC, simC.x, simC.y);
  gl.uniform1f(w.uRain, weather.rain);
  setLight(w);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, simOK ? sim.tex[sim.r] : dummyTex); gl.uniform1i(w.uSim, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, foamTex); gl.uniform1i(w.uFoam, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, causTex); gl.uniform1i(w.uCaus, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, groundNoiseTex); gl.uniform1i(w.uGroundNoise, 3);
  bindSkyTextures(w, 4);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 3. BinbunGrass clumps
  if (grassReady){
    const g = grassProg.u;
    const cols = Math.ceil(2*halfX/GRASS_CELL) + 6, rows = Math.ceil(2*gHalfY/GRASS_CELL) + 10;
    const ox = Math.floor((camX - halfX)/GRASS_CELL) - 3, oy = Math.floor((camY + gHalfY)/GRASS_CELL) + 2;
    gl.useProgram(grassProg); gl.bindVertexArray(emptyVao);
    gl.uniform2f(g.uCam, camX, camY); gl.uniform2f(g.uHalf, halfX, halfY);
    const gust = 1 + 1.5*weather.rain;                          // grass bends harder in a storm
    gl.uniform2f(g.uWindVel, WIND_VELOCITY[0]*gust, WIND_VELOCITY[1]*gust);
    gl.uniform2i(g.uOrigin, ox, oy); gl.uniform1i(g.uCols, cols);
    gl.uniform1f(g.uCell, GRASS_CELL); gl.uniform1f(g.uTime, time); gl.uniform1f(g.uRandomVariation, 0.0);
    gl.uniform1f(g.uCutStart, 0.4); gl.uniform1f(g.uCutEnd, 0.6);
    setLight(g);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, grassAtlas); gl.uniform1i(g.uAtlas, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, groundNoiseTex); gl.uniform1i(g.uGroundNoise, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, windNoiseTex); gl.uniform1i(g.uWind, 2);
    bindSkyTextures(g, 3);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, cols*rows);
  }

  // 4. foam on the water
  sprCount = 0;
  for (const p of particles){
    const a = Math.min(1, (p.life/p.max)*1.8) * p.alpha, size = p.size*(1 + (1 - p.life/p.max)*1.6);
    pushSprite(p.x, p.y, size, 6, p.seed, size, a);
  }
  const s = sprProg.u;
  gl.useProgram(sprProg); gl.bindVertexArray(sprVao);
  gl.uniform2f(s.uCam, camX, camY); gl.uniform2f(s.uHalf, halfX, halfY);
  setLight(s);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  if (sprCount){
    gl.bindBuffer(gl.ARRAY_BUFFER, sprBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, sprData, 0, sprCount*6*FLOATS);
    gl.drawArrays(gl.TRIANGLES, 0, sprCount*6);
  }

  // 5. model shadows: meshes flattened along the light and multiplied straight over the scene.
  //    The stencil lets each pixel darken once, so overlapping parts never double the shadow.
  if (SKY.shadow > 0.01){
    gl.enable(gl.STENCIL_TEST); gl.stencilFunc(gl.EQUAL, 0, 0xff); gl.stencilOp(gl.KEEP, gl.KEEP, gl.INCR);
    gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
    drawMeshes(true, camX, camY, halfX, halfY);
    gl.disable(gl.STENCIL_TEST);
  }
  gl.disable(gl.BLEND);

  // 6. boats and beach balls, depth tested against each other
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  drawMeshes(false, camX, camY, halfX, halfY);
  gl.disable(gl.DEPTH_TEST);

  // 7. jet spray in the air, drawn over the boats (a droplet at height z shows z*tan(tilt) further up the screen)
  if (sparks.length){
    const start = sprCount, lift = SIN_T/COS_T;
    for (const k of sparks){
      if (k.drop){ pushSprite(k.x, k.y + k.z*lift, k.size, 13, k.seed, k.size, Math.min(1, k.life/0.3)*0.9); continue; }
      const a = Math.min(1, k.life/0.4)*Math.min(1, k.z*3 + 0.3)*0.36/(1 + k.size*1.5);   // the mist thins out as it spreads
      pushSprite(k.x, k.y + k.z*lift, k.size, 6, k.seed, k.size, a);
    }
    if (sprCount > start){
      gl.useProgram(sprProg); gl.bindVertexArray(sprVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, sprBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, start*6*FLOATS*4, sprData, start*6*FLOATS, (sprCount - start)*6*FLOATS);
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.drawArrays(gl.TRIANGLES, start*6, (sprCount - start)*6);
      gl.disable(gl.BLEND);
    }
  }
  // 8. falling rain over everything (all on the graphics card, see RAIN_VS)
  drawRain(camX, camY, halfX, halfY);
  updateTags(cam.x, cam.y, halfX, halfY);
}

const rainPer = () => weather.rain > 0.004 ? Math.max(1, Math.round(Math.pow(weather.rain, 0.85)*RAIN_PER_CELL)) : 0;
let rainDrawn = 0;
function rainCount(){ return rainDrawn; }
function drawRain(camX, camY, halfX, halfY){
  const per = rainPer(); rainDrawn = 0; if (!per) return;
  // cells whose drops can show on screen: the view, plus room for the wind drift and the height lift
  const gy = halfY/COS_T, m = 8, x0 = Math.floor((camX - halfX - m)/RAIN_CELL), x1 = Math.floor((camX + halfX + m)/RAIN_CELL);
  const y0 = Math.floor((camY - gy - m - 7)/RAIN_CELL), y1 = Math.floor((camY + gy + m)/RAIN_CELL);
  const cols = x1 - x0 + 1, n = cols*(y1 - y0 + 1)*per;
  const u = rainProg.u, r = weather.rain, wl = Math.hypot(WIND_VELOCITY[0], WIND_VELOCITY[1]), ws = (1 + 4.5*r)*weather.gust;
  gl.useProgram(rainProg); gl.bindVertexArray(emptyVao);
  gl.uniform2f(u.uCam, camX, camY); gl.uniform2f(u.uHalf, halfX, halfY);
  gl.uniform2f(u.uWind, WIND_VELOCITY[0]/wl*ws, WIND_VELOCITY[1]/wl*ws);
  gl.uniform2f(u.uRes, canvas.width, canvas.height);
  gl.uniform2i(u.uCell0, x0, y0); gl.uniform1i(u.uCols, cols); gl.uniform1i(u.uPer, per);
  gl.uniform1f(u.uCosT, COS_T); gl.uniform1f(u.uLift, SIN_T/COS_T); gl.uniform1f(u.uTime, time);
  gl.uniform1f(u.uWidth, Math.max(0.6, canvas.height/900)); gl.uniform1f(u.uBlur, 0.09 + 0.05*r); gl.uniform1f(u.uSize, 0.8 + 0.5*r);
  gl.uniform1f(u.uAlpha, 0.32 + 0.3*r);
  if (u.uLitS) gl.uniform3fv(u.uLitS, SKY.lit);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, n);
  gl.disable(gl.BLEND);
  rainDrawn = n;
}

/* ---------- name tags: over each sailor's boat, or at the screen edge pointing to them ---------- */
function removeTag(r){ if (r.tag){ r.tag.remove(); r.tag = null; } }
function updateTags(camX, camY, halfX, halfY){
  const W = innerWidth, H = innerHeight;
  for (const r of remotes.values()){
    if (!r.shown || r.id === watching){ if (r.tag && r.tag.style.display !== 'none') r.tag.style.display = 'none'; continue; }
    if (!r.tag){
      r.tag = document.createElement('div'); r.tag.className = 'tag';
      r.tag.appendChild(document.createElement('i')).textContent = '➤';
      r.tag.appendChild(document.createElement('span'));
      el('tags').appendChild(r.tag);
    }
    const t = r.tag; if (t.style.display) t.style.display = '';
    if (t.dataset.n !== r.name){ t.dataset.n = r.name; t.lastChild.textContent = r.name; }
    const sx = (r.x - camX)/halfX, sy = ((r.y - camY)*COS_T + (r.z + 1.3)*SIN_T)/halfY;
    const on = Math.abs(sx) < 0.97 && Math.abs(sy) < 0.95;
    let px, py;
    if (on){ px = (sx*0.5 + 0.5)*W; py = (0.5 - sy*0.5)*H; }
    else {
      const k = 0.92/Math.max(Math.abs(sx), Math.abs(sy));
      px = clampN((sx*k*0.5 + 0.5)*W, 50, W - 50); py = clampN((0.5 - sy*k*0.5)*H, 24, H - 12);
      const rot = 'rotate(' + Math.atan2(-sy, sx).toFixed(2) + 'rad)';
      if (t.dataset.r !== rot){ t.dataset.r = rot; t.firstChild.style.transform = rot; }
    }
    if (t.classList.contains('edge') === on) t.classList.toggle('edge', !on);
    const tr = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) translate(-50%,-100%)';
    if (t.dataset.t !== tr){ t.dataset.t = tr; t.style.transform = tr; }        // only touch the page when the tag moved
  }
}

/* ---------- HUD ---------- */
const el = id => document.getElementById(id);
const hudCache = {};
function setText(id, text){ if (hudCache[id] !== text){ hudCache[id] = text; el(id).textContent = text; } }
function updateHud(){
  const f = followed();
  setText('spd', Math.round(Math.hypot(f.vx, f.vy)*3.6) + ' km/h');
  const hrs = (6 + skyClock/CYCLE*24) % 24;
  setText('clock', String(Math.floor(hrs)).padStart(2, '0') + ':' + String(Math.floor((hrs % 1)*60)).padStart(2, '0') + (weather.rain > 0.05 ? '  ☂' : SKY.sun[2] >= 0 ? '  ☀' : '  ☾'));
  const bw = Math.round(boat.boost*100) + '%';
  if (hudCache.boost !== bw){ hudCache.boost = bw; el('boostbar').style.width = bw; }
  const others = online.size;
  setText('netbox', f !== boat ? 'watching ' + f.name : others ? others + (others === 1 ? ' other sailor' : ' other sailors') : '');
}
let toastTimer = 0;
function toast(msg){
  const t = el('toast'); t.textContent = msg; t.className = 'on';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 1100);
}

/* ---------- input ---------- */
const keymap = { KeyW:'up', ArrowUp:'up', KeyS:'down', ArrowDown:'down', KeyA:'left', ArrowLeft:'left', KeyD:'right', ArrowRight:'right', ShiftLeft:'boost', ShiftRight:'boost', KeyQ:'strafeL', KeyE:'strafeR' };
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (/^Digit[1-5]$/.test(e.code)){ selectBoat(+e.code.slice(5) - 1); return; }
  if (e.code === 'KeyH'){ el('helppanel').classList.toggle('hide'); return; }
  if (e.code === 'KeyF'){ if (!e.repeat) cycleWatch(); return; }
  if (e.code === 'Space'){ e.preventDefault(); if (state === 'ready') startGame(); jump(); return; }
  const k = keymap[e.code];
  if (k){
    input[k] = true; e.preventDefault();
    if (k !== 'boost'){ if (watching) setWatching(null); if (state === 'ready') startGame(); }   // sailing brings the camera home
  }
  else if (e.code === 'KeyR'){ resetGame(); startGame(); }
});
addEventListener('keyup', e => { const k = keymap[e.code]; if (k) input[k] = false; });
addEventListener('blur', () => { for (const k in input) input[k] = false; });
el('go').addEventListener('click', startGame);
el('helpbtn').addEventListener('click', e => { el('helppanel').classList.toggle('hide'); e.currentTarget.blur(); });
el('netbox').addEventListener('click', cycleWatch);
const nick = el('nick');
nick.value = myName;
nick.addEventListener('change', () => { setName(nick.value); nick.value = myName; });
nick.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape'){ setName(nick.value); nick.value = myName; nick.blur(); } });
el('boatsel').addEventListener('click', e => { const i = e.target.dataset && e.target.dataset.i; if (i !== undefined) selectBoat(+i); });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); input[k] = true; if (watching) setWatching(null); if (state === 'ready') startGame(); };
  const off = e => { e.preventDefault(); input[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

/* ---------- resize, automatic render scale and loop ----------
   The pixel budget starts at about 1080p worth (2.3 million pixels). When frames
   run slow for two seconds it drops by a fifth (down to 0.6 million); after eight
   smooth seconds it climbs back, but never above a budget that was slow before. */
let pixelCap = 2.3e6, pixelCeil = 2.3e6, dtAvg = 1/60, slowT = 0, fastT = 0;
function adaptScale(raw){
  if (raw > 0.2 || document.hidden) return;                    // a stall or a hidden tab says nothing about the GPU
  dtAvg += (raw - dtAvg)*0.05;
  if (dtAvg > 1/40){ slowT += raw; fastT = 0; } else if (dtAvg < 1/55){ fastT += raw; slowT = 0; } else { slowT = fastT = 0; }
  if (slowT > 2 && pixelCap > 0.6e6){ pixelCeil = Math.min(pixelCeil, pixelCap*0.9); pixelCap = Math.max(0.6e6, pixelCap*0.8); slowT = 0; dtAvg = 1/50; }
  if (fastT > 8 && pixelCap < pixelCeil){ pixelCap = Math.min(pixelCeil, pixelCap*1.15); fastT = 0; }
}
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(pixelCap/Math.max(1, innerWidth*innerHeight)));
  const w = Math.max(1, Math.floor(innerWidth*dpr)), h = Math.max(1, Math.floor(innerHeight*dpr));
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
}
addEventListener('resize', resize); resize();

let last = performance.now();
let manual = false;                  // automated checks can step the game at an exact frame time
function frame(now){
  const raw = (now - last)/1000; last = now;
  const dt = Math.min(0.05, Math.max(0.001, raw));
  if (!manual){ adaptScale(raw); resize(); update(dt); drawScene(); }
  requestAnimationFrame(frame);
}
updateWeather(0, true);
selectBoat(boatIndex, true);
resetGame();
requestAnimationFrame(frame);
netConnect();

// Handle for automated checks.
window.__river = { boat, cam, input, get state(){ return state; }, get simOK(){ return simOK; },
  startGame, resetGame, bankDist, setManual(v){ manual = v; }, tick(dt){ update(dt); drawScene(); }, step(dt){ update(dt); }, baseFlow,
  get floaters(){ return floaters; }, get ready(){ return true; }, setClock(t){ skyClock = t; updateSky(0); }, get particles(){ return particles.length; },
  get seed(){ return SEED; }, get weather(){ return { rain: weather.rain, cloud: weather.cloud, wet: weather.wet, regime: weather.regime, drops: rainCount() }; },
  setRain(v){ weather.forced = v == null ? null : Math.min(1, Math.max(0, +v)); updateWeather(0, true); updateSky(0); }, wxAt, get away(){ return away; }, setIdle(ms){ lastInput = Date.now() - ms; }, setName, get pixelCap(){ return pixelCap; }, id: myId, get watching(){ return watching; }, watch: cycleWatch,
  get net(){ return { status: net.status, joined: net.joined, sent: net.sent, recv: net.recv, online: [...online.values()],
    remotes: [...remotes.values()].filter(r => r.shown).map(r => ({ id: r.id, name: r.name, b: r.b, x: r.x, y: r.y, th: r.th, z: r.z })) }; } };
})();
</script>
